8-a-kino","sec":"A1_08","audio":"A1_08_A","dur":114.12,"topic":"Am Samstag ins Kino","topicKo":"토요일에 영화 보러 가기","situation":"Sie hören ein Telefongespräch. · Aufgabe 1–8 · 3지선다 · 2회 청취 (문제 읽기 30초)","plays":2,"prepSeconds":30,"transcriptSource":"official","hasT":true,"lines":[{"sp":"Tobias","text":"Hallo, hier ist Tobias.","ko":"여보세요, 토비아스입니다.","t":[0.48,2.85]},{"sp":"Lena","text":"Hallo Tobias, hier ist Lena. Wie geht's?","ko":"안녕 토비아스, 나 레나야. 잘 지내?","t":[3.01,6.94]},{"sp":"Tobias","text":"Hallo Lena! Gut, danke. Und dir?","ko":"안녕 레나! 잘 지내, 고마워. 너는?","t":[7.1,11.05]},{"sp":"Lena","text":"Auch gut. Du, hast du am Samstag Zeit?","ko":"나도 잘 지내. 있잖아, 토요일에 시간 있어?","t":[11.21,15.65]},{"sp":"Tobias","text":"Ja, am Samstag habe ich Zeit. Gehen wir zusammen schwimmen?","ko":"응, 토요일에는 시간 있어. 같이 수영하러 갈래?","t":[15.81,20.49]},{"sp":"Lena","text":"Hm, ich weiß nicht. Am Samstag ist das Wetter schlecht. Es regnet den ganzen Tag, und es ist kalt.","ko":"음, 글쎄. 토요일에는 날씨가 나빠. 하루 종일 비가 오고 추워.","t":[20.65,30.17]},{"sp":"Lena","text":"Und am Vormittag arbeite ich im Café, bis zwei Uhr.","ko":"그리고 오전에는 카페에서 일해. 두 시까지.","t":[30.25,34.62]},{"sp":"Tobias","text":"Schade. Und am Nachmittag? Wir können ins Kino gehen.","ko":"아쉽다. 그럼 오후에는? 영화 보러 갈 수 있잖아.","t":[34.78,39.78]},{"sp":"Lena","text":"Ja, gern! Welcher Film läuft denn?","ko":"응, 좋아! 무슨 영화 해?","t":[39.94,43.26]},{"sp":"Tobias","text":"„Ein Sommer mit Oma“. Das ist eine Komödie. Der Film beginnt um Viertel nach fünf.","ko":"'할머니와 함께한 여름'. 코미디야. 영화는 다섯 시 십오 분에 시작해.","t":[43.42,49.68]},{"sp":"Lena","text":"Super, ich mag Komödien. Was kostet eine Karte?","ko":"좋아, 나 코미디 좋아해. 표 한 장에 얼마야?","t":[49.84,54.58]},{"sp":"Tobias","text":"Eine Karte kostet neun Euro. Aber wir sind Studenten. Dann kostet sie nur sechs Euro.","ko":"표 한 장은 9유로야. 그런데 우리는 대학생이잖아. 그러면 6유로만 내면 돼.","t":[54.74,61.87]},{"sp":"Lena","text":"Toll! Kaufst du die Karten?","ko":"잘됐다! 표는 네가 살래?","t":[62.03,64.66]},{"sp":"Tobias","text":"Ja, das mache ich heute Abend im Internet. Wo treffen wir uns?","ko":"응, 오늘 저녁에 인터넷으로 살게. 우리 어디서 만나?","t":[64.82,69.44]},{"sp":"Lena","text":"Vor dem Kino, um fünf?","ko":"극장 앞에서, 다섯 시에?","t":[69.6,72.03]},{"sp":"Tobias","text":"Hm, lieber an der Bushaltestelle am Marktplatz. Dann fahren wir zusammen mit dem Bus. Der Bus kommt um zwanzig vor fünf.","ko":"음, 그보다는 시장 광장 버스 정류장이 좋겠어. 그러면 같이 버스를 타고 가자. 버스는 네 시 사십 분에 와.","t":[72.19,81.32]},{"sp":"Lena","text":"Okay. Also um zwanzig vor fünf am Marktplatz. Und nach dem Film?","ko":"알았어. 그럼 네 시 사십 분에 시장 광장에서. 영화 끝나고는?","t":[81.48,87.63]},{"sp":"Tobias","text":"Neben dem Kino gibt es ein Restaurant. Dort ist die Pizza sehr gut. Hast du dann Hunger?","ko":"극장 옆에 식당이 하나 있어. 거기 피자가 아주 맛있어. 그때 배고플 거지?","t":[87.79,94.37]},{"sp":"Lena","text":"Bestimmt! Ich esse gern Pizza.","ko":"분명히 고플 거야! 나 피자 좋아해.","t":[94.53,97.61]},{"sp":"Tobias","text":"Ach ja, meine Schwester Anna ist am Wochenende bei mir. Kann sie auch mitkommen?","ko":"아 참, 내 여동생 안나가 주말에 우리 집에 와 있어. 걔도 같이 가도 돼?","t":[97.77,103.38]},{"sp":"Lena","text":"Natürlich! Dann kaufst du drei Karten, ja?","ko":"물론이지! 그럼 표 세 장 사는 거지?","t":[103.54,107.23]},{"sp":"Tobias","text":"Genau, drei Karten. Bis Samstag, Lena!","ko":"맞아, 세 장. 토요일에 봐, 레나!","t":[107.39,111.21]},{"sp":"Lena","text":"Bis Samstag! Tschüss!","ko":"토요일에 봐! 안녕!","t":[111.37,113.66]}],"keyVocab":[{"w":"Zeit haben","m":"시간이 있다"},{"w":"schwimmen gehen","m":"수영하러 가다"},{"w":"das Wetter ist schlecht","m":"날씨가 나쁘다"},{"w":"ins Kino gehen","m":"영화 보러 가다"},{"w":"die Komödie","m":"코미디"},{"w":"Viertel nach fünf","m":"5시 15분"},{"w":"zwanzig vor fünf","m":"4시 40분"},{"w":"die Karte","m":"표, 티켓"},{"w":"die Bushaltestelle","m":"버스 정류장"},{"w":"sich treffen","m":"만나다"},{"w":"Hunger haben","m":"배고프다"},{"w":"mitkommen","m":"같이 가다"}],"keySentences":[{"de":"Hast du am Samstag Zeit?","ko":"토요일에 시간 있어?"},{"de":"Welcher Film läuft denn?","ko":"무슨 영화 해?"},{"de":"Was kostet eine Karte?","ko":"표 한 장에 얼마야?"},{"de":"Wo treffen wir uns?","ko":"우리 어디서 만나?"},{"de":"Kann sie auch mitkommen?" 가격이고, 6유로는 깎아 주는 금액이 아니라 내는 금액입니다.","trap":"number"},{"no":"6","de":"Wo treffen sich Lena und Tobias?","ko":"레나와 토비아스는 어디에서 만나는가? a) 극장 앞에서, 다섯 시에 / b) 극장 옆 식당에서 / c) 버스가 서는 곳에서","isExample":false,"options":[{"t":"vor dem Kino, um fünf Uhr"},{"t":"im Restaurant neben dem Kino"},{"t":"dort, wo der Bus hält"}],"answer":2,"confidence":"official","evidence":[{"line":15,"quote":"Hm, lieber an der Bushaltestelle am Marktplatz."}],"explain":"극장 앞에서 만나자는 레나에게 토비아스는 시장 광장의 버스 정류장(Bushaltestelle)이 더 좋다고 합니다 → 버스가 서는(hält) 곳. 식당은 영화가 끝난 뒤에 가는 곳입니다.","trap":"context"},{"no":"7","de":"Was machen die beiden nach dem Film?","ko":"두 사람은 영화가 끝난 뒤 무엇을 하는가? a) 함께 밥 먹으러 간다 / b) 버스를 타고 집에 간다 / c) 영화를 한 편 더 본다","isExample":false,"options":[{"t":"Sie gehen zusammen essen."},{"t":"Sie fahren mit dem Bus nach Hause."},{"t":"Sie sehen noch einen Film."}],"answer":0,"confidence":"official","evidence":[{"line":17,"quote":"Neben dem Kino gibt es ein Restaurant."},{"line":18,"quote":"Ich esse gern Pizza."}],"explain":"극장 옆 식당의 피자가 맛있다는 말에 레나도 피자를 좋아한다고 답합니다 → 함께 밥 먹으러 간다. 버스는 영화 보러 갈 때 타는 것입니다.","trap":"paraphrase"},{"no":"8","de":"Wer kommt noch mit?","ko":"누가 함께 가는가? a) 레나의 여동생 안나 / b) 토비아스의 가족 한 사람 / c) 카페에서 일하는 레나의 친구","isExample":false,"options":[{"t":"Lenas Schwester Anna"},{"t":"jemand aus Tobias' Familie"},{"t":"eine Freundin von Lena aus dem Café"}],"answer":1,"confidence":"official","evidence":[{"line":19,"quote":"Ach ja, meine Schwester Anna ist am Wochenende bei mir."}],"explain":"주말에 토비아스의 여동생 안나가 와 있어서 같이 간다고 합니다 → 토비아스의 가족(Familie) 한 사람. 안나는 레나의 동생이 아니라 토비아스의 동생입니다.","trap":"context"}]},{"id":"a1-09-a-markt","sec":"A1_09","audio":"A1_09_A","dur":125.57,"topic":"Auf dem Wochenmarkt","topicKo":"토요일 아침 장터에서","situation":"Sie hören ein Gespräch auf dem Markt. · Aufgabe 1–9 · richtig oder falsch · 2회 청취 (문제 읽기 30초)","plays":2,"prepSeconds":30,"transcriptSource":"official","hasT":true,"lines":[{"sp":"Herr Vogel","text":"Guten Morgen! Was möchten Sie heute?","ko":"안녕하세요! 오늘은 무엇을 드릴까요?","t":[0.48,3.65]},{"sp":"Frau Roth","text":"Guten Morgen! Ich brauche Äpfel. Ich backe heute einen Apfelkuchen.","ko":"안녕하세요! 사과가 필요해요. 오늘 사과 케이크를 굽거든요.","t":[3.81,9.96]},{"sp":"Herr Vogel","text":"Für einen Kuchen? Dann nehmen Sie die grünen Äpfel hier. Sie sind ein bisschen sauer, aber sehr gut zum Backen.","ko":"케이크용이요? 그럼 여기 이 초록 사과를 가져가세요. 조금 시긴 하지만 굽기에는 아주 좋아요.","t":[10.12,18.83]},{"sp":"Frau Roth","text":"Gut. Was kostet ein Kilo?","ko":"좋아요. 1킬로에 얼마예요?","t":[18.99,22.11]},{"sp":"Herr Vogel","text":"Ein Kilo kostet zwei Euro achtzig.","ko":"1킬로에 2유로 80센트예요.","t":[22.27,25.67]},{"sp":"Frau Roth","text":"Dann nehme ich zwei Kilo, bitte. Mein Sohn hat morgen Geburtstag, und zwölf Kinder kommen zu uns.","ko":"그럼 2킬로 주세요. 아들이 내일 생일이라 아이들 열두 명이 우리 집에 와요.","t":[25.83,33.5]},{"sp":"Herr Vogel","text":"Zwölf Kinder? Da brauchen Sie viel Kuchen! Möchten Sie noch etwas?","ko":"아이 열두 명이요? 케이크가 많이 필요하겠네요! 더 필요한 거 있으세요?","t":[33.66,39.88]},{"sp":"Frau Roth","text":"Haben Sie Erdbeeren? Mein Sohn isst so gern Erdbeeren.","ko":"딸기 있어요? 아들이 딸기를 정말 좋아하거든요.","t":[40.04,45.35]},{"sp":"Herr Vogel","text":"Nein, tut mir leid. Erdbeeren gibt es nur im Sommer. Aber ich habe Bananen und Trauben.","ko":"아뇨, 죄송해요. 딸기는 여름에만 나와요. 하지만 바나나랑 포도는 있어요.","t":[45.51,52.91]},{"sp":"Frau Roth","text":"Bananen mag er nicht so gern. Dann nehme ich die Trauben. Ein halbes Kilo, bitte.","ko":"바나나는 그 애가 별로 안 좋아해요. 그럼 포도로 할게요. 반 킬로 주세요.","t":[53.07,59.5]},{"sp":"Herr Vogel","text":"Gern. Brauchen Sie auch Eier für den Kuchen?","ko":"그러죠. 케이크에 쓸 달걀도 필요하세요?","t":[59.66,63.29]},{"sp":"Frau Roth","text":"Nein, danke, Eier habe ich zu Hause. Aber ich brauche noch Sahne. Haben Sie Sahne?","ko":"아뇨, 괜찮아요. 달걀은 집에 있어요. 그런데 생크림이 더 필요해요. 생크림 있어요?","t":[63.45,70.43]},{"sp":"Herr Vogel","text":"Nein, Sahne habe ich nicht. Aber dort drüben, am Käsestand, gibt es Sahne.","ko":"아뇨, 생크림은 없어요. 하지만 저기 건너편 치즈 가게에 생크림이 있어요.","t":[70.59,76.83]},{"sp":"Frau Roth","text":"Ah, danke! Was macht das zusammen?","ko":"아, 고마워요! 모두 얼마예요?","t":[76.99,80.7]},{"sp":"Herr Vogel","text":"Die Äpfel fünf Euro sechzig und die Trauben zwei Euro. Das macht sieben Euro sechzig.","ko":"사과가 5유로 60센트, 포도가 2유로요. 모두 7유로 60센트입니다.","t":[80.86,88.23]},{"sp":"Frau Roth","text":"Kann ich mit Karte bezahlen?","ko":"카드로 계산할 수 있어요?","t":[88.39,90.52]},{"sp":"Herr Vogel","text":"Nein, leider nicht. Sie können hier nur bar bezahlen.","ko":"아뇨, 안타깝지만 안 돼요. 여기서는 현금으로만 계산하실 수 있어요.","t":[90.68,95.14]},{"sp":"Frau Roth","text":"Kein Problem. Hier sind zehn Euro.","ko":"괜찮아요. 여기 10유로요.","t":[95.3,98.32]},{"sp":"Herr Vogel","text":"Danke. Und zwei Euro vierzig zurück.","ko":"고맙습니다. 거스름돈 2유로 40센트요.","t":[98.48,101.86]},{"sp":"Herr Vogel","text":"Ach, und hier sind noch drei Pflaumen für Ihren Sohn. Die sind ein Geschenk.","ko":"아, 그리고 아드님 주라고 자두 세 개 더 드릴게요. 선물이에요.","t":[101.94,107.38]},{"sp":"Frau Roth","text":"Oh, wie nett! Vielen Dank! Sind Sie nächsten Samstag wieder hier?","ko":"어머, 친절하시네요! 정말 고마워요! 다음 주 토요일에도 여기 계세요?","t":[107.54,112.96]},{"sp":"Herr Vogel","text":"Nein, nächste Woche mache ich Urlaub. Aber in zwei Wochen bin ich wieder da.","ko":"아뇨, 다음 주에는 휴가를 가요. 하지만 2주 뒤에는 다시 나와요.","t":[113.12,118.77]},{"sp":"Frau Roth","text":"Schön! Dann bis bald!","ko":"좋네요! 그럼 또 봬요!","t":[118.93,121.17]},{"sp":"Herr Vogel","text":"Auf Wiedersehen! Und viel Spaß beim Geburtstag!","ko":"안녕히 가세요! 생일 파티 즐겁게 보내세요!","t":[121.33,125.12]}],"keyVocab":[{"w":"die Äpfel","m":"사과들 (der Apfel)"},{"w":"backen","m":"(빵·케이크를) 굽다"},{"w":"sauer","m":"신, 시큼한"},{"w":"das Kilo","m":"킬로그램"},{"w":"der Geburtstag","m":"생일"},{"w":"die Erdbeeren","m":"딸기 (die Erdbeere)"},{"w":"die Trauben","m":"포도 (die Traube)"},{"w":"ein halbes Kilo","m":"반 킬로, 500그램"},{"w":"die Sahne","m":"생크림"},{"w":"zusammen","m":"모두 합해서"},{"w":"bar bezahlen","m":"현금으로 내다"},{"w":"zurück","m":"(거스름돈으로) 돌려주는"},{"w":"das Geschenk","m":"선물"},{"w":"Urlaub machen","m":"휴가를 보내다"}],"keySentences":[{"de":"Was möchten Sie heute?","ko":"오늘은 무엇을 드릴까요?"},{"de":"Was kostet ein Kilo?","ko":"1킬로에 얼마예요?"},{"de":"Möchten Sie noch etwas?","ko":"더 필요한 거 있으세요?"},{"de":"Was macht das zusammen?","ko":"모두 얼마예요?"},{"de":"Kann ich mit Karte bezahlen?","ko":"카드로 계산할 수 있어요?"},{"de":"Viel Spaß beim Geburtstag!","ko":"생일 파티 즐겁게 보내세요!"}],"vocab":{"Guten":{"meaning":"좋은 — Guten Morgen! = (아침 인사) 안녕하세요 (gut)","example":"Guten Morgen!","exampleKo":"안녕하세요!"},"Morgen":{"meaning":"아침 — Guten Morgen! = (아침 인사) 안녕하세요 (der Morgen)","example":"Guten Morgen!","exampleKo":"안녕하세요!"},"möchten":{"meaning":"원하다, ~하고 싶다 (mögen의 접속법, 공손한 표현)","example":"Was möchten Sie heute?","exampleKo":"오늘은 무엇을 드릴까요?"},"heute":{"meaning":"오늘","example":"Was möchten Sie heute?","exampleKo":"오늘은 무엇을 드릴까요?"},"brauche":{"meaning":"필요하다 (brauchen)","example":"Ich brauche Äpfel.","exampleKo":"사과가 필요해요."},"Äpfel":{"meaning":"사과들 (der Apfel, 복수 Äpfel)","example":"Ich brauche Äpfel.","exampleKo":"사과가 필요해요."},"backe":{"meaning":"(케이크·빵을) 굽다 (backen)","example":"Ich backe heute einen Apfelkuchen.","exampleKo":"오늘 사과 케이크를 굽거든요."},"Apfelkuchen":{"meaning":"사과 케이크 (der Apfelkuchen)","example":"Ich backe heute einen Apfelkuchen.","exampleKo":"오늘 사과 케이크를 굽거든요."},"Kuchen":{"meaning":"케이크 (der Kuchen)","example":"Für einen Kuchen?","exampleKo":"케이크용이요?"},"nehmen":{"meaning":"가져가다, 사다 (nehmen) — Ich nehme … = ~로 할게요(살게요)","example":"Dann nehmen Sie die grünen Äpfel hier.","exampleKo":"그럼 여기 이 초록 사과를 가져가세요."},"grünen":{"meaning":"초록색의 (grün)","example":"Dann nehmen Sie die grünen Äpfel hier.","exampleKo":"그럼 여기 이 초록 사과를 가져가세요."},"bisschen":{"meaning":"조금 — ein bisschen = 약간","example":"Sie sind ein bisschen sauer, aber sehr gut zum Backen.","exampleKo":"조금 시긴 하지만 굽기에는 아주 좋아요."},"sauer":{"meaning":"신, 시큼한","example":"Sie sind ein bisschen sauer, aber sehr gut zum Backen.","exampleKo":"조금 시긴 하지만 굽기에는 아주 좋아요."},"Backen":{"meaning":"굽기 — zum Backen = 굽는 용도로 (das Backen)","example":"Sie sind ein bisschen sauer, aber sehr gut zum Backen.","exampleKo":"조금 시긴 하지만 굽기에는 아주 좋아요."},"kostet":{"meaning":"값이 ~이다 (kosten)","example":"Was kostet 스러운 — Tut mir leid = 죄송해요","example":"Nein, tut mir leid.","exampleKo":"아뇨, 죄송해요."},"gibt":{"meaning":"~이 있다 — es gibt = ~이 있다 (geben)","example":"Erdbeeren gibt es nur im Sommer.","exampleKo":"딸기는 여름에만 나와요."},"Sommer":{"meaning":"여름 (der Sommer)","example":"Erdbeeren gibt es nur im Sommer.","exampleKo":"딸기는 여름에만 나와요."},"Bananen":{"meaning":"바나나들 (die Banane)","example":"Aber ich habe Bananen und Trauben.","exampleKo":"하지만 바나나랑 포도는 있어요."},"Trauben":{"meaning":"포도 (die Traube, 복수 Trauben)","example":"Aber ich habe Bananen und Trauben.","exampleKo":"하지만 바나나랑 포도는 있어요."},"mag":{"meaning":"좋아하다 (mögen)","example":"Bananen mag er nicht so gern.","exampleKo":"바나나는 그 애가 별로 안 좋아해요."},"halbes":{"meaning":"절반의 — ein halbes Kilo = 반 킬로 (halb)","example":"Ein halbes Kilo, bitte.","exampleKo":"반 킬로 주세요."},"Eier":{"meaning":"달걀들 (das Ei, 복수 Eier)","example":"Brauchen Sie auch Eier für den Kuchen?","exampleKo":"케이크에 쓸 달걀도 필요하세요?"},"Hause":{"meaning":"집 — zu Hause = 집에 (das Haus)","example":"Nein, danke, Eier habe ich zu Hause.","exampleKo":"아뇨, 괜찮아요. 달걀은 집에 있어요. 그런데 생크림이 더 필요해요. 생크림 있어요?"},"Sahne":{"meaning":"생크림 (die Sahne)","example":"Aber ich brauche noch Sahne.","exampleKo":"아뇨, 괜찮아요. 달걀은 집에 있어요. 그런데 생크림이 더 필요해요. 생크림 있어요?"},"drüben":{"meaning":"건너편에 — dort drüben = 저기 건너편에","example":"Aber dort drüben, am Käsestand, gibt es Sahne.","exampleKo":"하지만 저기 건너편 치즈 가게에 생크림이 있어요."},"Käsestand":{"meaning":"치즈 가판대 (der Käsestand)","example":"Aber dort drüben, am Käsestand, gibt es Sahne.","exampleKo":"하지만 저기 건너편 치즈 가게에 생크림이 있어요."},"macht":{"meaning":"(합계가) ~이다 — Das macht … = 모두 ~입니다 (machen)","example":"Was macht das zusammen?","exampleKo":"모두 얼마예요?"},"zusammen":{"meaning":"모두 합해서, 함께","example":"Was macht das zusammen?","exampleKo":"모두 얼마예요?"},"fünf":{"meaning":"5","example":"Die Äpfel fünf Euro sechzig und die Trauben zwei Euro.","exampleKo":"사과가 5유로 60센트, 포도가 2유로요."},"sechzig":{"meaning":"60","example":"Die Äpfel fünf Euro sechzig und die Trauben zwei Euro.","exampleKo":"사과가 5유로 60센트, 포도가 2유로요."},"sieben":{"meaning":"7","example":"Das macht sieben Euro sechzig.","exampleKo":"모두 7유로 60센트입니다."},"Karte":{"meaning":"카드 (die Karte)","example":"Kann ich mit Karte bezahlen?","exampleKo":"카드로 계산할 수 있어요?"},"bezahlen":{"meaning":"돈을 내다, 계산하다","example":"Kann ich mit Karte bezahlen?","exampleKo":"카드로 계산할 수 있어요?"},"leider":{"meaning":"유감스럽게도, 안타깝지만","example":"Nein, leider nicht.","exampleKo":"아뇨, 안타깝지만 안 돼요."},"bar":{"meaning":"현금으로","example":"Sie können hier nur bar bezahlen.","exampleKo":"여기서는 현금으로만 계산하실 수 있어요."},"Problem":{"meaning":"문제 (das Problem)","example":"Kein Problem.","exampleKo":"괜찮아요."},"zehn":{"meaning":"10","example":"Hier sind zehn Euro.","exampleKo":"여기 10유로요."},"vierzig":{"meaning":"40","example":"Und zwei Euro vierzig zurück.","exampleKo":"거스름돈 2유로 40센트요."},"zurück":{"meaning":"되돌려 — … zurück = 거스름돈 ~","example":"Und zwei Euro vierzig zurück.","exampleKo":"거스름돈 2유로 40센트요."},"drei":{"meaning":"3","example":"Ach, und hier sind noch drei Pflaumen für Ihren Sohn.","exampleKo":"아, 그리고 아드님 주라고 자두 세 개 더 드릴게요."},"Pflaumen":{"meaning":"자두들 (die Pflaume)","example":"Ach, und hier sind noch drei Pflaumen für Ihren Sohn.","exampleKo":"아, 그리고 아드님 주라고 자두 세 개 더 드릴게요."},"Geschenk":{"meaning":"선물 (das Geschenk)","example":"Die sind ein Geschenk.","exampleKo":"선물이에요."},"nett":{"meaning":"친절한, 다정한","example":"Oh, wie nett!","exampleKo":"어머, 친절하시네요!"},"nächsten":{"meaning":"다음의 — nächsten Samstag = 다음 주 토요일 (nächst)","example":"Sind Sie nächsten Samstag wieder hier?","exampleKo":"다음 주 토요일에도 여기 계세요?"},"Samstag":{"meaning":"토요일 (der Samstag)","example":"Sind Sie nächsten Samstag wieder hier?","exampleKo":"다음 주 토요일에도 여기 계세요?"},"wieder":{"meaning":"다시","example":"Sind Sie nächsten Samstag wieder hier?","exampleKo":"다음 주 토요일에도 여기 계세요?"},"Woche":{"meaning":"주, 일주일 (die Woche, 복수 Wochen)","example":"Nein, nächste Woche mache ich Urlaub.","exampleKo":"아뇨, 다음 주에는 휴가를 가요."},"Urlaub":{"meaning":"휴가 — Urlaub machen = 휴가를 보내다 (der Urlaub)","example":"Nein, nächste Woche mache ich Urlaub.","exampleKo":"아뇨, 다음 주에는 휴가를 가요."},"Wochen":{"meaning":"주들 (die Woche, 복수 Wochen) — in zwei Wochen = 2주 뒤에","example":"Aber in zwei Wochen bin ich wieder da.","exampleKo":"하지만 2주 뒤에는 다시 나와요."},"bald":{"meaning":"곧 — Bis bald! = 또 봐요!","example":"Dann bis bald!","exampleKo":"그럼 또 봬요!"},"Wiedersehen":{"meaning":"다시 만남 — Auf Wiedersehen! = 안녕히 가세요!","example":"Auf Wiedersehen!","exampleKo":"안녕히 가세요!"},"Spaß":{"meaning":"재미 — Viel Spaß! = 즐거운 시간 보내세요! (der Spaß)","example":"Und viel Spaß beim Geburtstag!","exampleKo":"생일 파티 즐겁게 보내세요!"}},"vx":{"Guten":"Guten","Morgen":"Morgen","möchten":"möchten","Möchten":"möchten","heute":"heute","brauche":"brauche","brauchen":"brauche","Brauchen":"brauche","Äpfel":"Äpfel","backe":"backe","Apfelkuchen":"Apfelkuchen","Kuchen":"Kuchen","nehmen":"nehmen","nehme":"nehmen","grünen":"grünen","bisschen":"bisschen","sauer":"sauer","Backen":"Backen","kostet":"kostet","Kilo":"Kilo","Euro":"Euro","achtzig":"achtzig","Sohn":"Sohn","morgen":"morgen","Geburtstag":"Geburtstag","zwölf":"zwölf","Kinder":"Kinder","kommen":"kommen","viel":"viel","noch":"noch","etwas":"etwas","Erdbeeren":"Erdbeeren","isst":"isst","gern":"gern","tut":"tut","leid":"leid","gibt":"gibt","Sommer":"Sommer","Bananen":"Bananen","Trauben":"Trauben","mag":"mag","halbes":"halbes","Eier":"Eier","Hause":"Hause","Sahne":"Sahne","drüben":"drüben","Käsestand":"Käsestand","macht":"macht","zusammen":"zusammen","fünf":"fünf","sechzig":"sechzig","sieben":"sieben","Karte":"Karte","bezahlen":"bezahlen","leider":"leider","bar":"bar","Problem":"Problem","zehn":"zehn","vierzig":"vierzig","zurück":"zurück","drei":"drei","Pflaumen":"Pflaumen","Geschenk":"Geschenk","nett":"nett","nächsten":"nächsten","nächste":"nächsten","Samstag":"Samstag","wieder":"wieder","Woche":"Woche","Urlaub":"Urlaub","Wochen":"Wochen","bald":"bald","Wiedersehen":"Wiedersehen","Spaß":"Spaß"},"vl":{"guten":"Guten","morgen":"Morgen","möchten":"möchten","heute":"heute","brauche":"brauche","brauchen":"brauche","äpfel":"Äpfel","backe":"backe","apfelkuchen":"Apfelkuchen","kuchen":"Kuchen","nehmen":"nehmen","nehme":"nehmen","grünen":"grünen","bisschen":"bisschen","sauer":"sauer","backen":"Backen","kostet":"kostet","kilo":"Kilo","euro":"Euro","achtzig":"achtzig","sohn":"Sohn","geburtstag":"Geburtstag","zwölf":"zwölf","kinder":"Kinder","kommen":"kommen","viel":"viel","noch":"noch","etwas":"etwas","erdbeeren":"Erdbeeren","isst":"isst","gern":"gern","tut":"tut","leid":"leid","gibt":"gibt","sommer":"Sommer","bananen":"Bananen","trauben":"Trauben","mag":"mag","halbes":"halbes","eier":"Eier","hause":"Hause","sahne":"Sahne","drüben":"drüben","käsestand":"Käsestand","macht":"macht","zusammen":"zusammen","fünf":"fünf","sechzig":"sechzig","sieben":"sieben","karte":"Karte","bezahlen":"bezahlen","leider":"leider","bar":"bar","problem":"Problem","zehn":"zehn","vierzig":"vierzig","zurück":"zurück","drei":"drei","pflaumen":"Pflaumen","geschenk":"Geschenk","nett":"nett","nächsten":"nächsten","nächste":"nächsten","samstag":"Samstag","wieder":"wieder","woche":"Woche","urlaub":"Urlaub","wochen":"Wochen","bald":"bald","wiedersehen":"Wiedersehen","spaß":"Spaß"},"imageBank":[],"questions":[{"no":"1","de":"Frau Roth kauft Obst für einen Kuchen.","ko":"로트 씨는 케이크에 쓸 과일을 산다","isExample":false,"options":[{"t":"Richtig"},{"t":"Falsch"}],"answer":0,"confidence":"official","evidence":[{"line":1,"quote":"Ich brauche Äpfel."},{"line":1,"quote":"Ich backe heute einen Apfelkuchen."}],"explain":"사과(Äpfel)는 과일(Obst)입니다. 오늘 사과 케이크(Apfelkuchen)를 굽는다고 했으니 → 케이크에 쓸 과일을 삽니다. 본문의 '사과'가 문제에서는 '과일'로 바뀌었습니다.","trap":"paraphrase"},{"no":"2","de":"Die grünen Äpfel sind sehr süß.","ko":"초록 사과는 아주 달다","isExample":false,"options":[{"t":"Richtig"},{"t":"Falsch"}],"answer":1,"confidence":"official","evidence":[{"line":2,"quote":"Sie sind ein bisschen sauer, aber sehr gut zum Backen."}],"explain":"초록 사과는 조금 시다(sauer)고 했습니다. süß(달다)는 sauer의 반대말입니다. sehr(아주)는 '굽기에 아주 좋다(sehr gut zum Backen)'에서 들린 말입니다.","trap":"wording"},{"no":"3","de":"Für die Äpfel bezahlt Frau Roth mehr als fünf Euro.","ko":"로트 씨는 사과 값으로 5유로보다 많이 낸다","isExample":false,"options":[{"t":"Richtig"},{"t":"Falsch"}],"answer":0,"confidence":"official","evidence":[{"line":4,"quote":"Ein Kilo kostet zwei Euro achtzig."},{"line":5,"quote":"Dann nehme ich zwei Kilo, bitte."},{"line":14,"quote":"Die Äpfel fünf Euro sechzig"}],"explain":"1킬로에 2유로 80센트이고 2킬로를 삽니다 → 2,80 × 2 = 5유로 60센트. 상인도 '사과 5유로 60센트'라고 말합니다. 5유로보다 많습니다.","trap":"number"},{"no":"4","de":"Der Sohn von Frau Roth hat heute Geburtstag.","ko":"로트 씨의 아들은 오늘이 생일이다","isExample":false,"options":[{"t":"Richtig"},{"t":"Falsch"}],"answer":1,"confidence":"official","evidence":[{"line":5,"quote":"Mein Sohn hat morgen Geburtstag"}],"explain":"생일은 오늘(heute)이 아니라 내일(morgen)입니다. heute는 '오늘 케이크를 굽는다(Ich backe heute…)'에서 들린 말입니다.","trap":"wording"},{"no":"5","de":"Am Stand gibt es heute keine Erdbeeren.","ko":"오늘 이 가게에는 딸기가 없다","isExample":false,"options":[{"t":"Richtig"},{"t":"Falsch"}],"answer":0,"confidence":"official","evidence":[{"line":8,"quote":"Nein, tut mir leid."},{"line":8,"quote":"Erdbeeren gibt es nur im Sommer."}],"explain":"딸기가 있느냐는 질문에 '죄송해요, 딸기는 여름에만 나와요'라고 답합니다 → 지금 이 가게(Stand)에는 딸기가 없습니다.","trap":"paraphrase"},{"no":"6","de":"Frau Roth kauft Bananen für ihren Sohn.","ko":"로트 씨는 아들을 위해 바나나를 산다","isExample":false,"options":[{"t":"Richtig"},{"t":"Falsch"}],"answer":1,"confidence":"official","evidence":[{"line":9,"quote":"Bananen mag er nicht so gern."},{"line":9,"quote":"Dann nehme ich die Trauben."}],"explain":"아들은 바나나를 별로 좋아하지 않아서 포도(Trauben)를 삽니다. 바나나는 상인이 '있다'고 말한 과일일 뿐입니다.","trap":"wording"},{"no":"7","de":"Frau Roth bekommt zwei Euro sechzig zurück.","ko":"로트 씨는 거스름돈으로 2유로 60센트를 받는다","isExample":false,"options":[{"t":"Richtig"},{"t":"Falsch"}],"answer":1,"confidence":"official","evidence":[{"line":17,"quote":"Hier sind zehn Euro."},{"line":18,"quote":"Und zwei Euro vierzig zurück."}],"explain":"10유로를 내고 7유로 60센트를 계산하면 거스름돈은 2유로 40센트(zwei Euro vierzig)입니다. sechzig(60)는 합계 금액 '7유로 60센트'에서 들린 숫자입니다.","trap":"number"},{"no":"8","de":"Frau Roth muss die Pflaumen nicht bezahlen.","ko":"로트 씨는 자두 값을 내지 않아도 된다","isExample":false,"options":[{"t":"Richtig"},{"t":"Falsch"}],"answer":0,"confidence":"official","evidence":[{"line":19,"quote":"Die sind ein Geschenk."}],"explain":"상인이 아들에게 주라며 자두 세 개를 주고 '선물(Geschenk)'이라고 합니다 → 돈을 내지 않아도 됩니다.","trap":"paraphrase"},{"no":"9","de":"Herr Vogel ist am nächsten Samstag nicht auf dem Markt.","ko":"포겔 씨는 다음 주 토요일에 시장에 없다","isExample":false,"options":[{"t":"Richtig"},{"t":"Falsch"}],"answer":0,"confidence":"official","evidence":[{"line":20,"quote":"Sind Sie nächsten Samstag wieder hier?"},{"line":21,"quote":"Nein, nächste Woche mache ich Urlaub."}],"explain":"다음 주 토요일에도 나오느냐는 질문에 '아뇨, 다음 주에는 휴가를 가요(Urlaub machen)'라고 답합니다 → 다음 주 토요일에는 시장에 없습니다. '2주 뒤에 다시 나온다'는 말과 헷갈리지 마세요.","trap":"paraphrase"}]},{"id":"a1-10-a-tagebuch","sec":"A1_10","audio":"A1_10_A","dur":127.44,"topic":"Meine erste Woche in Hamburg","topicKo":"함부르크에서 보낸 첫 주","situation":"Sie hören ein Audio-Tagebuch. · Aufgabe 1–8 · 3지선다 · 2회 청취 (문제 읽기 30초)","plays":2,"prepSeconds":30,"transcriptSource":"official","hasT":true,"lines":[{"sp":"Paul","text":"Hallo, liebes Tagebuch! Heute ist Sonntag, und es ist schon neun Uhr am Abend.","ko":"안녕, 일기장! 오늘은 일요일이고, 벌써 저녁 아홉 시예요.","t":[0.48,7.22]},{"sp":"Paul","text":"Ich wohne jetzt seit einer Woche in Hamburg. Hier mache ich eine Ausbildung als Koch.","ko":"저는 함부르크에 산 지 이제 일주일이 됐어요. 여기서 요리사가 되려고 직업 교육을 받고 있어요.","t":[7.38,13.53]},{"sp":"Paul","text":"Ich arbeite in der Küche von einem großen Hotel am Hafen. Meine Kollegen sind sehr nett, aber der Chef ist nicht so freundlich.","ko":"항구에 있는 큰 호텔의 주방에서 일해요. 동료들은 아주 친절한데, 주방장은 그다지 친절하지 않아요.","t":[13.69,23.84]},{"sp":"Paul","text":"Ich arbeite von Dienstag bis Samstag, meistens von zehn Uhr morgens bis sieben Uhr abends.","ko":"화요일부터 토요일까지 일하고, 보통 아침 열 시부터 저녁 일곱 시까지 일해요.","t":[24.0,32.02]},{"sp":"Paul","text":"Ich wohne in einer WG, zusammen mit Jonas und Aylin. Mein Zimmer ist klein, aber es hat einen Balkon.","ko":"저는 요나스, 아일린과 함께 셰어하우스에 살아요. 제 방은 작지만 발코니가 있어요.","t":[32.61,41.5]},{"sp":"Paul","text":"Die Miete ist 420 Euro im Monat. Das ist für Hamburg nicht teuer.","ko":"집세는 한 달에 420유로예요. 함부르크치고는 비싸지 않아요.","t":[41.66,47.71]},{"sp":"Paul","text":"Jonas studiert Musik. Er spielt jeden Abend Gitarre, und das ist manchmal ziemlich laut.","ko":"요나스는 음악을 전공해요. 매일 저녁 기타를 치는데, 그게 가끔 꽤 시끄러워요.","t":[47.87,55.46]},{"sp":"Paul","text":"Aylin studiert Medizin. Sie lernt sehr viel, oft bis Mitternacht.","ko":"아일린은 의학을 공부해요. 공부를 아주 많이 해서, 자정까지 하는 날도 많아요.","t":[55.62,61.84]},{"sp":"Paul","text":"Heute Morgen war ich mit Aylin auf dem Fischmarkt. Wir sind schon um sieben Uhr aufgestanden!","ko":"오늘 아침에는 아일린과 함께 어시장에 갔어요. 우리는 벌써 아침 일곱 시에 일어났어요!","t":[62.43,69.34]},{"sp":"Paul","text":"Dort haben wir Fischbrötchen gegessen. Danach sind wir mit dem Schiff über die Elbe gefahren.","ko":"거기서 생선 샌드위치를 먹었어요. 그다음에는 배를 타고 엘베강을 건넜어요.","t":[69.5,76.06]},{"sp":"Paul","text":"Das kostet nichts extra. Man braucht nur eine normale Fahrkarte für Bus und Bahn.","ko":"그건 돈이 따로 들지 않아요. 버스와 전철에 쓰는 보통 승차권만 있으면 돼요.","t":[76.22,82.71]},{"sp":"Paul","text":"Leider regnet es hier sehr oft. Und am Mittwoch ist mein Regenschirm kaputtgegangen.","ko":"아쉽게도 여기는 비가 아주 자주 와요. 그리고 수요일에 제 우산이 망가졌어요.","t":[83.3,89.74]},{"sp":"Paul","text":"Meine Mutter ruft jeden Abend an. Mein Vater schreibt nur kurze Nachrichten.","ko":"엄마는 매일 저녁 전화하세요. 아빠는 짧은 메시지만 보내세요.","t":[90.33,96.38]},{"sp":"Paul","text":"Aber am Samstag kommen meine Eltern und meine kleine Schwester nach Hamburg. Sie bleiben bis Sonntag.","ko":"그런데 토요일에 부모님과 여동생이 함부르크에 와요. 일요일까지 머물러요.","t":[96.54,103.56]},{"sp":"Paul","text":"Am Samstag arbeite ich nur bis vier. Dann zeige ich ihnen den Hafen, und am Abend gehen wir zusammen essen. Aber nicht im Hotel!","ko":"토요일에는 네 시까지만 일해요. 그다음에 가족에게 항구를 보여 주고, 저녁에는 다 같이 밥을 먹으러 가요. 하지만 호텔에서는 안 먹어요!","t":[103.72,114.15]},{"sp":"Paul","text":"So, jetzt bin ich müde. Morgen habe ich frei.","ko":"자, 이제 피곤해요. 내일은 쉬는 날이에요.","t":[114.74,119.45]},{"sp":"Paul","text":"Ich schlafe lange, und dann kaufe ich endlich einen neuen Regenschirm. Gute Nacht, Tagebuch!","ko":"늦잠을 자고, 그다음에 드디어 새 우산을 살 거예요. 잘 자, 일기장!","t":[119.61,126.97]}],"keyVocab":[{"w":"das Tagebuch","m":"일기, 일기장"},{"w":"die Ausbildung","m":"직업 교육 (일하면서 직업을 배우는 과정)"},{"w":"der Koch","m":"요리사"},{"w":"der Hafen","m":"항구"},{"w":"die WG","m":"셰어하우스, 공동 주거 (= Wohngemeinschaft)"},{"w":"der Balkon","m":"발코니"},{"w":"die Miete","m":"집세, 월세"},{"w":"laut","m":"시끄러운"},{"w":"der Fischmarkt","m":"어시장"},{"w":"das Schiff","m":"배"},{"w":"der Regenschirm","m":"우산"},{"w":"kaputtgehen","m":"고장 나다, 망가지다"},{"w":"frei haben","m":"쉬다, 근무가 없다"}],"keySentences":[{"de":"Ich wohne jetzt seit einer Woche in Hamburg.","ko":"저는 함부르크에 산 지 이제 일주일이 됐어요."},{"de":"Ich arbeite von Dienstag bis Samstag.","ko":"화요일부터 토요일까지 일해요."},{"de":"Mein Zimmer ist klein, aber es hat einen Balkon.","ko":"제 방은 작지만 발코니가 있어요."},{"de":"Am Mittwoch ist mein Regenschirm kaputtgegangen.","ko":"수요일에 제 우산이 망가졌어요."},{"de":"Morgen habe ich frei.","ko":"내일은 쉬어요."}],"vocab":{"Hallo":{"meaning":"안녕, 안녕하세요 (인사)","example":"Hallo, liebes Tagebuch!","exampleKo":"안녕, 일기장!"},"liebes":{"meaning":"사랑하는, 소중한 (lieb) — liebes Tagebuch = (일기 첫머리) 일기장에게","example":"Hallo, liebes Tagebuch!","exampleKo":"안녕, 일기장!"},"Tagebuch":{"meaning":"일기, 일기장 (das Tagebuch)","example":"Hallo, liebes Tagebuch!","exampleKo":"안녕, 일기장!"},"Heute":{"meaning":"오늘","example":"Heute ist Sonntag, und es ist schon neun Uhr am Abend.","exampleKo":"오늘은 일요일이고, 벌써 저녁 아홉 시예요."},"Sonntag":{"meaning":"일요일 (der Sonntag)","example":"Heute ist Sonntag, und es ist schon neun Uhr am Abend.","exampleKo":"오늘은 일요일이고, 벌써 저녁 아홉 시예요."},"schon":{"meaning":"벌써, 이미","example":"Heute ist Sonntag, und es ist schon neun Uhr am Abend.","exampleKo":"오늘은 일요일이고, 벌써 저녁 아홉 시예요."},"neun":{"meaning":"9, 아홉","example":"Heute ist Sonntag, und es ist schon neun Uhr am Abend.","exampleKo":"오늘은 일요일이고, 벌써 저녁 아홉 시예요."},"Uhr":{"meaning":"~시 — neun Uhr = 아홉 시 (die Uhr)","example":"Heute ist Sonntag, und es ist schon neun Uhr am Abend.","exampleKo":"오늘은 일요일이고, 벌써 저녁 아홉 시예요."},"Abend":{"meaning":"저녁 (der Abend) — am Abend = 저녁에 · jeden Abend = 매일 저녁","example":"Heute ist Sonntag, und es ist schon neun Uhr am Abend.","exampleKo":"오늘은 일요일이고, 벌써 저녁 아홉 시예요."},"wohne":{"meaning":"살다 (wohnen)","example":"Ich wohne jetzt seit einer Woche in Hamburg.","exampleKo":"저는 함부르크에 산 지 이제 일주일이 됐어요."},"jetzt":{"meaning":"지금, 이제","example":"Ich wohne jetzt seit einer Woche in Hamburg.","exampleKo":"저는 함부르크에 산 지 이제 일주일이 됐어요."},"seit":{"meaning":"~ 전부터, ~째 — seit einer Woche = 일주일 전부터","example":"Ich wohne jetzt seit einer Woche in Hamburg.","exampleKo":"저는 함부르크에 산 지 이제 일주일이 됐어요."},"Woche":{"meaning":"주, 일주일 (die Woche)","example":"Ich wohne jetzt seit einer Woche in Hamburg.","exampleKo":"저는 함부르크에 산 지 이제 일주일이 됐어요."},"Hamburg":{"meaning":"함부르크 (독일 북부의 항구 도시)","example":"Ich wohne jetzt seit einer Woche in Hamburg.","exampleKo":"저는 함부르크에 산 지 이제 일주일이 됐어요."},"mache":{"meaning":"하다 (machen) — eine Ausbildung machen = 직업 교육을 받다","example":"Hier mache ich eine Ausbildung als Koch.","exampleKo":"여기서 요리사가 되려고 직업 교육을 받고 있어요."},"Ausbildung":{"meaning":"직업 교육 (die Ausbildung) — 회사에서 일하면서 직업을 배우는 과정","example":"Hier mache ich eine Ausbildung als Koch.","exampleKo":"여기서 요리사가 되려고 직업 교육을 받고 있어요."},"als":{"meaning":"~로서 — Ausbildung als Koch = 요리사가 되는 직업 교육","example":"Hier mache ich eine Ausbildung als Koch.","exampleKo":"여기서 요리사가 되려고 직업 교육을 받고 있어요."},"Koch":{"meaning":"요리사 (der Koch)","example":"Hier mache ich eine Ausbildung als Koch.","exampleKo":"여기서 요리사가 되려고 직업 교육을 받고 있어요."},"arbeite":{"meaning":"일하다 (arbeiten)","example":"Ich arbeite in der Küche von einem großen Hotel am Hafen.","exampleKo":"항구에 있는 큰 호텔의 주방에서 일해요."},"Küche":{"meaning":"부엌, 주방 (die Küche)","example":"Ich arbeite in der Küche von einem großen Hotel am Hafen.","exampleKo":"항구에 있는 큰 호텔의 주방에서 일해요."},"großen":{"meaning":"큰 (groß)","example":"Ich arbe ank":[],"questions":[{"no":"1","de":"Wie lange wohnt Paul schon in Hamburg?","ko":"폴은 함부르크에 산 지 얼마나 되었나? a) 7일 / b) 9일 / c) 두 달","isExample":false,"options":[{"t":"seit sieben Tagen"},{"t":"seit neun Tagen"},{"t":"seit zwei Monaten"}],"answer":0,"confidence":"official","evidence":[{"line":1,"quote":"Ich wohne jetzt seit einer Woche in Hamburg."}],"explain":"'seit einer Woche'(일주일 전부터)라고 했습니다 → 일주일은 7일(sieben Tage)입니다. '9'는 처음에 말한 시각(neun Uhr am Abend)에서 나온 숫자라 함정입니다.","trap":"paraphrase"},{"no":"2","de":"Was macht Paul in Hamburg?","ko":"폴은 함부르크에서 무엇을 하는가? a) 대학에서 음악을 전공한다 / b) 주방에서 직업을 배운다 / c) 항구에서 웨이터로 일한다","isExample":false,"options":[{"t":"Er studiert Musik an der Universität."},{"t":"Er lernt in einer Küche einen Beruf."},{"t":"Er arbeitet als Kellner am Hafen."}],"answer":1,"confidence":"official","evidence":[{"line":1,"quote":"Hier mache ich eine Ausbildung als Koch."},{"line":2,"quote":"Ich arbeite in der Küche von einem großen Hotel am Hafen."}],"explain":"'Ausbildung als Koch'는 요리사가 되려고 일하면서 배우는 직업 교육입니다 → 주방에서 직업을 배운다(einen Beruf lernen). 음악을 전공하는 사람은 요나스이고, 웨이터(Kellner)라는 말은 나오지 않습니다.","trap":"paraphrase"},{"no":"3","de":"An welchen Tagen arbeitet Paul nicht?","ko":"폴이 일하지 않는 날은 언제인가? a) 토요일과 일요일 / b) 월요일과 화요일 / c) 일요일과 월요일","isExample":false,"options":[{"t":"am Samstag und am Sonntag"},{"t":"am Montag und am Dienstag"},{"t":"am Sonntag und am Montag"}],"answer":2,"confidence":"official","evidence":[{"line":3,"quote":"Ich arbeite von Dienstag bis Samstag"},{"line":15,"quote":"Morgen habe ich frei."}],"explain":"화요일부터 토요일까지(von Dienstag bis Samstag) 일한다고 했으니 일하지 않는 날은 일요일과 월요일입니다. 일요일인 오늘 '내일은 쉰다(Morgen habe ich frei)'고 한 말도 이를 확인해 줍니다. 토요일에도 일하므로 a는 틀립니다.","trap":"context"},{"no":"4","de":"Was sagt Paul über sein Zimmer?","ko":"폴은 자기 방에 대해 무엇이라고 하는가? a) 크고 밝지만 아쉽게도 발코니가 없다 / b) 크지 않지만 밖에 앉아 있을 수 있다 / c) 폴은 방값으로 한 달에 240유로를 낸다","isExample":false,"options":[{"t":"Es ist groß und hell, aber es hat leider keinen Balkon."},{"t":"Es ist nicht groß, aber man kann draußen sitzen."},{"t":"Paul bezahlt dafür 240 Euro im Monat."}],"answer":1,"confidence":"official","evidence":[{"line":4,"quote":"Mein Zimmer ist klein, aber es hat einen Balkon."}],"explain":"방은 작지만(klein) 발코니(Balkon)가 있다고 했습니다 → 크지 않지만(nicht groß) 밖에 앉을 수 있다(draußen sitzen). 집세는 240유로가 아니라 420유로입니다. 숫자 순서를 바꾼 함정입니다.","trap":"paraphrase"},{"no":"5","de":"Was erzählt Paul über Jonas?","ko":"폴은 요나스에 대해 무엇을 이야기하는가? a) 저녁에 거의 집에 없다 / b) 의학을 공부하고 공부를 아주 많이 한다 / c) 저녁에 자주 악기를 연주한다","isExample":false,"options":[{"t":"Er ist am Abend fast nie zu Hause."},{"t":"Er studiert Medizin und lernt sehr viel."},{"t":"Am Abend spielt er oft ein Instrument."}],"answer":2,"confidence":"official","evidence":[{"line":6,"quote":"Er spielt jeden Abend Gitarre"}],"explain":"요나스는 매일 저녁 기타를 친다(Gitarre spielen)고 했습니다 → 저녁에 자주 악기(Instrument)를 연주한다. 기타가 '악기'로 바뀌었습니다. 의학을 공부하고 자정까지 공부하는 사람은 아일린입니다.","trap":"paraphrase"},{"no":"6","de":"Was hat Paul heute Morgen gemacht?","ko":"폴은 오늘 아침에 무엇을 했는가? a) 시장에도 물 위에도 있었다 / b) 아일린과 함께 우산을 샀다 / c) 열 시까지 침대에 누워 있었다","isExample":false,"options":[{"t":"Er war auf dem Markt und auf dem Wasser."},{"t":"Er hat mit Aylin einen Regenschirm gekauft."},{"t":"Er hat bis zehn Uhr im Bett gelegen."}],"answer":0,"confidence":"official","evidence":[{"line":8,"quote":"Heute Morgen war ich mit Aylin auf dem Fischmarkt."},{"line":9,"quote":"Danach sind wir mit dem Schiff über die Elbe gefahren."}],"explain":"오늘 아침에는 어시장(Fischmarkt)에 갔고, 그다음 배(Schiff)를 타고 엘베강을 건넜습니다 → 시장(Markt)에도 가고 물(Wasser) 위에도 있었다. 우산을 사고 늦잠을 자는 것은 내일 계획이고, 오늘은 일곱 시에 일어났습니다.","trap":"context"},{"no":"7","de":"Warum braucht Paul einen neuen Regenschirm?","ko":"폴은 왜 새 우산이 필요한가? a) 수요일에 버스에 우산을 두고 내렸다 / b) 예전 우산이 더는 제대로 되지 않는다 / c) 수요일부터 함부르크에 매일 비가 온다","isExample":false,"options":[{"t":"Er hat seinen Schirm am Mittwoch im Bus vergessen."},{"t":"Sein alter Schirm funktioniert nicht mehr."},{"t":"Ab Mittwoch regnet es in Hamburg jeden Tag."}],"answer":1,"confidence":"official","evidence":[{"line":11,"quote":"Und am Mittwoch ist mein Regenschirm kaputtgegangen."}],"explain":"수요일에 우산이 망가졌다(kaputtgegangen)고 했습니다 → 예전 우산이 더는 제대로 되지 않는다(funktioniert nicht mehr). 버스에 두고 내렸다는 말은 없고, '수요일'은 우산이 망가진 날일 뿐입니다.","trap":"paraphrase"},{"no":"8","de":"Was macht Paul am Samstag?","ko":"폴은 토요일에 무엇을 하는가? a) 하루 종일 쉬고 집으로 간다 / b) 일하고 나서 가족을 만난다 / c) 저녁에 가족과 호텔에서 밥을 먹는다","isExample":false,"options":[{"t":"Er hat den ganzen Tag frei und fährt nach Hause."},{"t":"Er arbeitet und trifft danach seine Familie."},{"t":"Er isst am Abend mit seiner Familie im Hotel."}],"answer":1,"confidence":"official","evidence":[{"line":14,"quote":"Am Samstag arbeite ich nur bis vier."},{"line":14,"quote":"Dann zeige ich ihnen den Hafen"}],"explain":"토요일에는 네 시까지만 일하고(nur bis vier), 그다음 가족에게 항구를 보여 준다고 했습니다 → 일하고 나서 가족을 만난다. 가족이 함부르크로 오는 것이고, 저녁은 '호텔에서는 안 먹는다(Aber nicht im Hotel!)'고 했습니다.","trap":"context"}]},{"id":"a1-11-a-bahnhof","sec":"A1_11","audio":"A1_11_A","dur":127.51,"topic":"Am Fahrkartenschalter","topicKo":"기차역 매표소에서","situation":"Sie hören eine Durchsage und ein Gespräch am Fahrkartenschalter. · Aufgabe 1–9 · richtig oder falsch · 2회 청취 (문제 읽기 30초)","plays":2,"prepSeconds":30,"transcriptSource":"official","hasT":true,"lines":[{"sp":"Durchsage","text":"Achtung, eine Durchsage: Der Regionalexpress nach Heidelberg, Abfahrt neun Uhr zehn, hat heute circa zwanzig Minuten Verspätung. Wir bitten um Entschuldigung.","ko":"안내 말씀드립니다. 9시 10분에 출발하는 하이델베르크행 지역 급행열차는 오늘 약 20분 늦어집니다. 양해 부탁드립니다.","t":[0.48,14.47]},{"sp":"Mitarbeiter","text":"Guten Morgen! Was kann ich für Sie tun?","ko":"안녕하세요! 무엇을 도와드릴까요?","t":[14.63,17.65]},{"sp":"Frau Park","text":"Guten Morgen. Ich möchte eine Fahrkarte nach Heidelberg, bitte.","ko":"안녕하세요. 하이델베르크행 차표 한 장 주세요.","t":[17.81,22.43]},{"sp":"Mitarbeiter","text":"Gern. Nur hin oder hin und zurück?","ko":"네. 편도로 드릴까요, 왕복으로 드릴까요?","t":[22.59,26.35]},{"sp":"Frau Park","text":"Hin und zurück, bitte. Ich fahre heute und komme morgen Abend zurück.","ko":"왕복으로 주세요. 오늘 가서 내일 저녁에 돌아와요.","t":[26.51,32.1]},{"sp":"Mitarbeiter","text":"Erste oder zweite Klasse?","ko":"1등석이요, 2등석이요?","t":[32.26,34.67]},{"sp":"Frau Park","text":"Zweite Klasse. Was kostet das?","ko":"2등석이요. 얼마예요?","t":[34.83,37.86]},{"sp":"Mitarbeiter","text":"Das macht zusammen vierunddreißig Euro. Sind Sie Studentin? Dann ist es billiger.","ko":"모두 34유로입니다. 대학생이세요? 그러면 더 싸요.","t":[38.02,44.22]},{"sp":"Frau Park","text":"Nein, leider nicht. Ich bin Lehrerin. Ich arbeite hier in Frankfurt an einer Sprachschule.","ko":"아쉽지만 아니에요. 저는 교사예요. 여기 프랑크푸르트의 어학원에서 일해요.","t":[44.38,51.45]},{"sp":"Mitarbeiter","text":"Fahren Sie allein? Zu zweit ist es am Wochenende billiger.","ko":"혼자 가세요? 주말에는 두 사람이 함께 가면 더 싸요.","t":[51.61,56.07]},{"sp":"Frau Park","text":"Ja, ich fahre allein. Meine Freundin wohnt in Heidelberg. Sie hat morgen Geburtstag.","ko":"네, 혼자 가요. 제 친구가 하이델베르크에 살아요. 친구가 내일 생일이에요.","t":[56.23,62.52]},{"sp":"Mitarbeiter","text":"Schön! Der Regionalexpress fährt um neun Uhr zehn von Gleis sieben. Aber er hat heute zwanzig Minuten Verspätung.","ko":"좋네요! 지역 급행열차는 9시 10분에 7번 승강장에서 출발해요. 그런데 오늘은 20분 늦어요.","t":[62.68,71.67]},{"sp":"Frau Park","text":"Oh nein! Gibt es noch einen anderen Zug?","ko":"아, 이런! 다른 기차도 있어요?","t":[71.83,75.54]},{"sp":"Mitarbeiter","text":"Ja, den ICE um neun Uhr zwanzig von Gleis zwölf. Der ist schneller, aber er kostet zehn Euro mehr.","ko":"네, 9시 20분에 12번 승강장에서 출발하는 ICE가 있어요. 더 빠르지만 10유로 더 비싸요.","t":[75.7,84.83]},{"sp":"Frau Park","text":"Und wann bin ich dann in Heidelberg?","ko":"그럼 하이델베르크에는 언제 도착해요?","t":[84.99,87.79]},{"sp":"Mitarbeiter","text":"Mit dem ICE um zehn Uhr. Mit dem Regionalexpress um elf Uhr.","ko":"ICE로는 10시에, 지역 급행열차로는 11시에 도착해요.","t":[87.95,93.71]},{"sp":"Frau Park","text":"Ach, ich habe Zeit. Meine Freundin arbeitet heute bis zwölf. Ich nehme den Regionalexpress.","ko":"아, 저는 시간이 있어요. 친구가 오늘 열두 시까지 일하거든요. 지역 급행열차로 할게요.","t":[93.87,101.21]},{"sp":"Mitarbeiter","text":"Gut. Dann sind das vierunddreißig Euro. Zahlen Sie bar oder mit Karte?","ko":"좋아요. 그럼 34유로입니다. 현금으로 내세요, 카드로 내세요?","t":[101.37,107.27]},{"sp":"Frau Park","text":"Mit Karte, bitte. Ach, und wo kann ich hier einen Kaffee trinken?","ko":"카드로요. 아, 그리고 여기서 어디서 커피를 마실 수 있어요?","t":[107.43,112.59]},{"sp":"Mitarbeiter","text":"Gleich hier links, neben dem Blumenladen, ist ein Café. Auf Gleis sieben gibt es aber auch einen Kaffeeautomaten.","ko":"바로 여기 왼쪽, 꽃집 옆에 카페가 있어요. 그런데 7번 승강장에도 커피 자판기가 있어요.","t":[112.75,120.63]},{"sp":"Frau Park","text":"Super, vielen Dank! Auf Wiedersehen!","ko":"좋아요, 정말 고마워요! 안녕히 계세요!","t":[120.79,124.13]},{"sp":"Mitarbeiter","text":"Auf Wiedersehen und gute Reise!","ko":"안녕히 가세요, 즐거운 여행 되세요!","t":[124.29,127.06]}],"keyVocab":[{"w":"die Durchsage","m":"안내 방송"},{"w":"die Verspätung","m":"지연, 늦어짐"},{"w":"die Fahrkarte","m":"차표"},{"w":"hin und zurück","m":"왕복"},{"w":"die Klasse","m":"(열차의) 등급 — erste/zweite Klasse"},{"w":"billig","m":"싼"},{"w":"allein","m":"혼자"},{"w":"zu zweit","m":"둘이서"},{"w":"der Zug","m":"기차"},{"w":"das Gleis","m":"승강장, 선로"},{"w":"schnell","m":"빠른"},{"w":"bar zahlen","m":"현금으로 내다"},{"w":"der Blumenladen","m":"꽃집"},{"w":"die Reise","m":"여행"}],"keySentences":[{"de":"Ich möchte eine Fahrkarte nach Heidelberg, bitte.","ko":"하이델베르크행 차표 한 장 주세요."},{"de":"Nur hin oder hin und zurück?","ko":"편도로 드릴까요, 왕복으로 드릴까요?"},{"de":"Der Zug hat heute zwanzig Minuten Verspätung.","ko":"기차가 오늘 20분 늦어요."},{"de":"Wann bin ich dann in Heidelberg?","ko":"그럼 하이델베르크에는 언제 도착해요?"},{"de":"Zahlen Sie bar oder mit Karte?","ko":"현금으로 내세요, 카드로 내세요?"}],"vocab":{"Achtung":{"meaning":"주목, 주의 (die Achtung) — 안내 방송의 첫마디","example":"Achtung, eine Durchsage: Der Regionalexpress nach Heidelberg, Abfahrt neun Uhr zehn, hat heute circa zwanzig Minuten Verspätung.","exampleKo":"안내 말씀드립니다. 9시 10분에 출발하는 하이델베르크행 지역 급행열차는 오늘 약 20분 늦어집니다. 양해 부탁드립니다."},"Durchsage":{"meaning":"안내 방송 (die Durchsage)","example":"Achtung, eine Durchsage: Der Regionalexpress nach Heidelberg, Abfahrt neun Uhr zehn, hat heute circa zwanzig Minuten Verspätung.","exampleKo":"안내 말씀드립니다. 9시 10 fee","trinken":"trinken","gleich":"Gleich","links":"links","neben":"neben","blumenladen":"Blumenladen","café":"Café","kaffeeautomaten":"Kaffeeautomaten","super":"Super","dank":"Dank","wiedersehen":"Wiedersehen","reise":"Reise"},"imageBank":[],"questions":[{"no":"1","de":"Der Zug nach Heidelberg fährt heute später ab.","ko":"하이델베르크행 기차는 오늘 더 늦게 출발한다","isExample":false,"options":[{"t":"Richtig"},{"t":"Falsch"}],"answer":0,"confidence":"official","evidence":[{"line":0,"quote":"hat heute circa zwanzig Minuten Verspätung."}],"explain":"안내 방송에서 하이델베르크행 열차가 오늘 약 20분 늦어진다(Verspätung haben)고 했습니다 → 오늘 더 늦게(später) 출발합니다.","trap":"paraphrase"},{"no":"2","de":"Frau Park bleibt eine Nacht in Heidelberg.","ko":"박 씨는 하이델베르크에서 하룻밤을 지낸다","isExample":false,"options":[{"t":"Richtig"},{"t":"Falsch"}],"answer":0,"confidence":"official","evidence":[{"line":4,"quote":"Ich fahre heute und komme morgen Abend zurück."}],"explain":"오늘 가서 내일 저녁에(morgen Abend) 돌아온다고 했습니다 → 하이델베르크에서 하룻밤(eine Nacht)을 지냅니다.","trap":"context"},{"no":"3","de":"Frau Park bezahlt weniger, weil sie Studentin ist.","ko":"박 씨는 대학생이라서 돈을 덜 낸다","isExample":false,"options":[{"t":"Richtig"},{"t":"Falsch"}],"answer":1,"confidence":"official","evidence":[{"line":8,"quote":"Nein, leider nicht. Ich bin Lehrerin."}],"explain":"대학생이냐는 질문에 '아쉽지만 아니에요, 저는 교사예요'라고 답했습니다. 그래서 할인을 받지 못합니다. Studentin은 직원의 질문에서 들린 말입니다.","trap":"wording"},{"no":"4","de":"Frau Park arbeitet in einer Schule.","ko":"박 씨는 학교에서 일한다","isExample":false,"options":[{"t":"Richtig"},{"t":"Falsch"}],"answer":0,"confidence":"official","evidence":[{"line":8,"quote":"Ich arbeite hier in Frankfurt an einer Sprachschule."}],"explain":"프랑크푸르트의 어학원(Sprachschule)에서 일한다고 했습니다 → 어학원도 학교(Schule)입니다.","trap":"paraphrase"},{"no":"5","de":"Frau Park fährt mit ihrer Freundin nach Heidelberg.","ko":"박 씨는 친구와 함께 하이델베르크에 간다","isExample":false,"options":[{"t":"Richtig"},{"t":"Falsch"}],"answer":1,"confidence":"official","evidence":[{"line":10,"quote":"Ja, ich fahre allein. Meine Freundin wohnt in Heidelberg."}],"explain":"혼자(allein) 간다고 했습니다. 친구(Freundin)는 하이델베르크에 사는 사람이지, 함께 가는 사람이 아닙니다.","trap":"wording"},{"no":"6","de":"Mit dem ICE ist Frau Park eine Stunde früher in Heidelberg.","ko":"ICE를 타면 박 씨는 한 시간 더 일찍 하이델베르크에 도착한다","isExample":false,"options":[{"t":"Richtig"},{"t":"Falsch"}],"answer":0,"confidence":"official","evidence":[{"line":15,"quote":"Mit dem ICE um zehn Uhr. Mit dem Regionalexpress um elf Uhr."}],"explain":"ICE로는 10시, 지역 급행열차로는 11시에 도착합니다 → ICE가 한 시간(eine Stunde) 더 빠릅니다.","trap":"number"},{"no":"7","de":"Frau Park nimmt den Zug von Gleis zwölf.","ko":"박 씨는 12번 승강장에서 출발하는 기차를 탄다","isExample":false,"options":[{"t":"Richtig"},{"t":"Falsch"}],"answer":1,"confidence":"official","evidence":[{"line":16,"quote":"Ich nehme den Regionalexpress."},{"line":11,"quote":"Der Regionalexpress fährt um neun Uhr zehn von Gleis sieben."}],"explain":"12번 승강장(Gleis zwölf)에서 출발하는 것은 ICE입니다. 박 씨는 지역 급행열차(Regionalexpress)를 타므로 7번 승강장에서 출발합니다.","trap":"number"},{"no":"8","de":"Frau Park bezahlt die Fahrkarte bar.","ko":"박 씨는 차표 값을 현금으로 낸다","isExample":false,"options":[{"t":"Richtig"},{"t":"Falsch"}],"answer":1,"confidence":"official","evidence":[{"line":18,"quote":"Mit Karte, bitte."}],"explain":"현금(bar)이냐 카드냐는 질문에 '카드로요(mit Karte)'라고 답했습니다. bar는 직원의 질문에서 들린 말입니다.","trap":"wording"},{"no":"9","de":"Im Bahnhof gibt es neben einem Blumengeschäft ein Café.","ko":"역 안에 꽃 가게 옆에 카페가 있다","isExample":false,"options":[{"t":"Richtig"},{"t":"Falsch"}],"answer":0,"confidence":"official","evidence":[{"line":19,"quote":"Gleich hier links, neben dem Blumenladen, ist ein Café."}],"explain":"바로 왼쪽 꽃집(Blumenladen) 옆에 카페가 있다고 했습니다 → 꽃 가게(Blumengeschäft) 옆에 카페가 있습니다.","trap":"paraphrase"}]},{"id":"a1-12-a-friseur","sec":"A1_12","audio":"A1_12_A","dur":128.38,"topic":"Ein Termin beim Friseur","topicKo":"미용실 예약 전화","situation":"Sie hören ein Telefongespräch mit einem Friseursalon. · Aufgabe 1–9 · 3지선다 · 2회 청취 (문제 읽기 30초)","plays":2,"prepSeconds":30,"transcriptSource":"official","hasT":true,"lines":[{"sp":"Friseurin","text":"Friseursalon Kamm, guten Tag! Hier spricht Lena. Was kann ich für Sie tun?","ko":"미용실 캄입니다, 안녕하세요! 저는 레나예요. 무엇을 도와드릴까요?","t":[0.48,6.03]},{"sp":"Herr Kim","text":"Guten Tag, hier ist Kim. Ich möchte gern einen Termin zum Haareschneiden.","ko":"안녕하세요, 김입니다. 머리를 자르고 싶어서 예약하려고요.","t":[6.19,10.88]},{"sp":"Friseurin","text":"Gern. Wann möchten Sie denn kommen?","ko":"네. 언제 오고 싶으세요?","t":[11.04,13.78]},{"sp":"Herr Kim","text":"Geht es am Freitag? Ich arbeite bis fünf Uhr. Ab halb sechs habe ich Zeit.","ko":"금요일에 돼요? 제가 다섯 시까지 일해요. 다섯 시 반부터는 시간이 있어요.","t":[13.94,19.69]},{"sp":"Friseurin","text":"Am Freitag haben wir bis sechs Uhr geöffnet. Aber um halb sechs ist leider schon alles voll.","ko":"금요일에는 여섯 시까지 문을 열어요. 그런데 다섯 시 반에는 아쉽게도 벌써 예약이 다 찼어요.","t":[19.85,26.84]},{"sp":"Friseurin","text":"Vielleicht am Samstag? Da haben wir von neun bis vierzehn Uhr geöffnet.","ko":"토요일은 어떠세요? 그날은 9시부터 14시까지 문을 열어요.","t":[26.93,32.21]},{"sp":"Herr Kim","text":"Samstag ist schlecht. Da fahre ich zu meinen Eltern nach Köln.","ko":"토요일은 안 돼요. 그날은 쾰른에 계신 부모님 댁에 가요.","t":[32.37,36.24]},{"sp":"Friseurin","text":"Und nächste Woche? Am Dienstag haben wir bis acht Uhr abends geöffnet. Um sieben ist noch ein Termin frei.","ko":"그럼 다음 주는요? 화요일에는 저녁 8시까지 문을 열어요. 7시에 아직 예약 자리가 하나 비어 있어요.","t":[36.4,44.39]},{"sp":"Herr Kim","text":"Dienstag um sieben, das passt gut. Was kostet denn ein Haarschnitt?","ko":"화요일 7시, 좋아요. 그런데 커트는 얼마예요?","t":[44.55,49.44]},{"sp":"Friseurin","text":"Waschen, Schneiden und Föhnen kostet für Herren achtundzwanzig Euro. Nur Schneiden kostet zweiundzwanzig Euro.","ko":"남성은 샴푸, 커트, 드라이까지 하면 28유로예요. 커트만 하면 22유로예요.","t":[49.6,58.26]},{"sp":"Herr Kim","text":"Nur Schneiden, bitte. Die Haare wasche ich vorher zu Hause.","ko":"커트만 해 주세요. 머리는 미리 집에서 감을게요.","t":[58.42,62.24]},{"sp":"Friseurin","text":"Kein Problem. Möchten Sie zu einem bestimmten Friseur?","ko":"괜찮아요. 원하시는 미용사가 있으세요?","t":[62.4,66.35]},{"sp":"Herr Kim","text":"Ja, beim letzten Mal war ich bei Tom. Er war sehr gut.","ko":"네, 지난번에 톰한테 잘랐어요. 아주 잘해 줬어요.","t":[66.51,70.5]},{"sp":"Friseurin","text":"Tom ist leider im Urlaub. Er kommt erst in drei Wochen zurück. Aber Sarah hat am Dienstag um sieben Zeit.","ko":"톰은 아쉽게도 휴가 중이에요. 3주 뒤에야 돌아와요. 하지만 사라가 화요일 7시에 시간이 있어요.","t":[70.66,78.5]},{"sp":"Herr Kim","text":"Okay, dann gehe ich zu Sarah.","ko":"좋아요, 그럼 사라한테 할게요.","t":[78.66,81.02]},{"sp":"Friseurin","text":"Gut. Wie schreibt man Ihren Namen, Herr Kim?","ko":"좋아요. 김 선생님, 성함 철자가 어떻게 되나요?","t":[81.18,84.49]},{"sp":"Herr Kim","text":"K – I – M. Das ist ein koreanischer Name.","ko":"K, I, M이에요. 한국 이름이에요.","t":[84.65,89.16]},{"sp":"Friseurin","text":"Danke. Und wie ist Ihre Telefonnummer?","ko":"감사합니다. 그리고 전화번호는 어떻게 되세요?","t":[89.32,92.56]},{"sp":"Herr Kim","text":"Null eins sieben sechs, zwei drei vier, fünf fünf acht neun.","ko":"0176 234 5589예요.","t":[92.72,97.59]},{"sp":"Friseurin","text":"Danke schön. Also: Dienstag, der dreizehnte, um neunzehn Uhr bei Sarah. Bitte kommen Sie zehn Minuten früher.","ko":"감사합니다. 정리하면, 13일 화요일 19시에 사라에게 예약됐어요. 10분 일찍 와 주세요.","t":[97.75,106.77]},{"sp":"Herr Kim","text":"Mache ich. Gibt es bei Ihnen auch Parkplätze?","ko":"그럴게요. 거기 주차할 곳도 있어요?","t":[106.93,110.3]},{"sp":"Friseurin","text":"Nein, leider nicht. Aber die Bushaltestelle ist direkt vor dem Salon. Und hinter dem Supermarkt gibt es ein Parkhaus.","ko":"아니요, 아쉽게도 없어요. 하지만 버스 정류장이 미용실 바로 앞에 있어요. 그리고 슈퍼마켓 뒤에 주차 건물이 있어요.","t":[110.46,119.15]},{"sp":"Herr Kim","text":"Das Parkhaus ist teuer. Ich komme mit dem Bus. Vielen Dank und bis Dienstag!","ko":"주차 건물은 비싸요. 버스 타고 갈게요. 정말 고맙습니다, 화요일에 봬요!","t":[119.31,124.88]},{"sp":"Friseurin","text":"Bis Dienstag, Herr Kim! Auf Wiederhören!","ko":"화요일에 봬요, 김 선생님! 안녕히 계세요!","t":[125.02,127.91]}],"keyVocab":[{"w":"der Termin","m":"예약, 약속 시간"},{"w":"Haare schneiden","m":"머리를 자르다"},{"w":"der Haarschnitt","m":"커트, 이발"},{"w":"geöffnet haben","m":"문을 열다, 영업하다"},{"w":"voll","m":"꽉 찬 — alles ist voll = 자리가 다 찼다"},{"w":"frei","m":"비어 있는"},{"w":"passen","m":"(시간이) 맞다, 좋다"},{"w":"kosten","m":"값이 ~이다"},{"w":"waschen","m":"씻다, 감다"},{"w":"der Urlaub","m":"휴가"},{"w":"früher","m":"더 일찍"},{"w":"die Telefonnummer","m":"전화번호"},{"w":"die Bushaltestelle","m":"버스 정류장"},{"w":"das Parkhaus","m":"주차 건물"}],"keySentences":[{"de":"Ich möchte gern einen Termin zum Haareschneiden.","ko":"머리를 자르고 싶어서 예약하려고요."},{"de":"Geht es am Freitag?","ko":"금요일에 돼요?"},{"de":"Um halb sechs ist leider schon alles voll.","ko":"다섯 시 반에는 아쉽게도 벌써 예약이 다 찼어요."},{"de":"Was kostet denn ein Haarschnitt?","ko":"그런데 커트는 얼마예요?"},{"de":"Bitte kommen Sie zehn Minuten früher.","ko":"10분 일찍 와 주세요."}],"vocab":{"Friseursalon":{"meaning":"미용실 (der Friseursalon)","example":"Friseursalon Kamm, guten Tag!","exampleKo":"미용실 캄입니다, 안녕하세요!"},"Kamm":{"meaning":"캄 — 미용실 이름 (der Kamm = 빗)","example":"Friseursalon Kamm, guten Tag!","exampleKo":"미용실 캄입니다, 안녕하세요!"},"guten":{"meaning":"좋은 (gut) — Guten Tag = 안녕하세요","example":"Friseursalon Kamm, guten Tag!","exampleKo":"미용실 캄입니다, 안녕하세요!"},"Tag":{"meaning":"날, 낮 (der Tag) — Guten Tag = 안녕하세요","example":"Friseursalon Kamm, guten Tag!","exampleKo":"미용실 캄입니다, 안녕하세요!"},"Hier":{"meaning":"여기 — Hier spricht Lena = (전화에서) 레나입니다 · hier ist Kim = 김입니다","example":"Hier spricht Lena.","exampleKo":"저는 레나예요."},"spricht":{"meaning":"말하다 (sprechen)","example":"Hier spricht Lena.","exampleKo":"저는 레나예요."},"Lena":{"meaning":"레나 (여자 이름)","example":"Hier spricht Lena.","exampleKo":"저는 레나예요."},"Was":{"meaning":"무엇","example":"Was kann ich für Sie tun?","exampleKo":"무엇을 도와드릴까요?"},"kann":{"meaning":"~할 수 있다 (können)","example":"Was kann ich für Sie tun?","exampleKo":"무엇을 도와드릴까요?"},"tun":{"meaning":"하다 — Was kann ich für Sie tun? = 무엇을 도와드릴까요?","example":"Was kann ich für Sie tun?","exampleKo":"무엇을 도와드릴까요?"},"Kim":{"meaning":"김 (한국 성)","example":"Guten Tag, hier ist Kim.","exampleKo":"안녕하세요, 김입니다."},"möchte":{"meaning":"~하고 싶다, ~을 원하다 (möchten)","example":"Ich möchte gern einen Termin zum Haareschneiden.","exampleKo":"머리를 자르고 싶어서 예약하려고요."},"gern":{"meaning":"기꺼이, 즐겨 — Gern. = 네, 좋아요","example":"Ich möchte gern einen Termin zum Haareschneiden.","exampleKo":"머리를 자르고 싶어서 예약하려고요."},"Termin":{"meaning":"예약, 약속 시간 (der Termin)","example":"Ich möchte gern einen Termin zum Haareschneiden.","exampleKo":"머리를 자르고 싶어서 예약하려고요."},"Haareschneiden":{"meaning":"머리 자르기 (das Haareschneiden) — zum Haareschneiden = 머리를 자르러","example":"Ich möchte gern einen Termin zum Haareschneiden.","exampleKo":"머리를 자르고 싶어서 예약하려고요."},"Wann":{"meaning":"언제","example":"Wann möchten Sie denn kommen?","exampleKo":"언제 오고 싶으세요?"},"möchten":{"meaning":"~하고 싶다 (möchten)","example":"Wann möchten Sie denn kommen?","exampleKo":"언제 오고 싶으세요?"},"denn":{"meaning":"(질문을 부드럽게 하는 말) 그런데, 대체","example":"Wann möchten Sie denn kommen?","exampleKo":"언제 오고 싶으세요?"},"kommen":{"meaning":"오다 (kommen)","example":"Wann möchten Sie denn kommen?","exampleKo":"언제 오고 싶으세요?"},"Geht":{"meaning":"되다, 가능하다 (gehen) — Geht es am Freitag? = 금요일에 돼요?","example":"Geht es am Freitag?","exampleKo":"금요일에 돼요?"},"Freitag":{"meaning":"금요일 (der Freitag)","example":"Geht es am Freitag?","exampleKo":"금요일에 돼요?"},"arbeite":{"meaning":"일하다 (arbeiten)","example":"Ich arbeite bis fünf Uhr.","exampleKo":"제가 다섯 시까지 일해요."},"bis":{"meaning":"~까지","example":"Ich arbeite bis fünf Uhr.","exampleKo":"제가 다섯 시까지 일해요."},"fünf":{"meaning":"5, 다섯","example":"Ich arbeite bis fünf Uhr.","exampleKo":"제가 다섯 시까지 일해요."},"Uhr":{"meaning":"시 (die Uhr) — fünf Uhr = 5시","example":"Ich arbeite bis fünf Uhr.","exampleKo":"제가 다섯 시까지 일해요."},"halb":{"meaning":"반 — halb sechs = 5시 반 (6시가 되기 30분 전)","example":"Ab halb sechs habe ich Zeit.","exampleKo":"다섯 시 반부터는 시간이 있어요."},"sechs":{"meaning":"6, 여섯","example":"Ab halb sechs habe ich Zeit.","exampleKo":"다섯 시 반부터는 시간이 있어요."},"Zeit":{"meaning":"시간 (die Zeit) — Zeit haben = 시간이 있다","example":"Ab halb sechs habe ich Zeit.","exampleKo":"다섯 시 반부터는 시간이 있어요."},"geöffnet":{"meaning":"열린 — geöffnet haben = 문을 열다, 영업하다","example":"Am Freitag haben wir bis sechs Uhr geöffnet.","exampleKo":"금요일에는 여섯 시까지 문을 열어요."},"leider":{"meaning":"유감스럽게도, 아쉽게도","example":"Aber um halb sechs ist leider schon alles voll.","exampleKo":"그런데 다섯 시 반에는 아쉽게도 벌써 예약이 다 찼어요."},"schon":{"meaning":"벌써, 이미","example":"Aber um halb sechs ist leider schon alles voll.","exampleKo":"그런데 다섯 시 반에는 아쉽게도 벌써 예약이 다 찼어요."},"alles":{"meaning":"모든 것 — alles ist voll = 다 찼다","example":"Aber um halb sechs ist leider schon alles voll.","exampleKo":"그런데 다섯 시 반에는 아쉽게도 벌써 예약이 다 찼어요."},"voll":{"meaning":"꽉 찬","example":"Aber um halb sechs ist leider schon alles voll.","exampleKo":"그런데 다섯 시 반에는 아쉽게도 벌써 예약이 다 찼어요."},"Vielleicht":{"meaning":"아마, 어쩌면 — Vielleicht am Samstag? = 토요일은 어떠세요?","example":"Vielleicht am Samstag?","exampleKo":"토요일은 어떠세요?"},"Samstag":{"meaning":"토요일 (der Samstag)","example":"Vielleicht am Samstag?","exampleKo":"토요일은 어떠세요?"},"neun":{"meaning":"9, 아홉","example":"Da haben wir von neun bis vierzehn Uhr geöffnet.","exampleKo":"그날은 9시부터 14시까지 문을 열어요."},"vierzehn":{"meaning":"14, 열넷 — vierzehn Uhr = 14시 = 오후 2시","example":"Da haben wir von neun bis vierzehn Uhr geöffnet.","exampleKo":"그날은 9시부터 14시까지 문을 열어요."},"schlecht":{"meaning":"나쁜 — Samstag ist schlecht = 토요일은 안 돼요","example":"Samstag ist schlecht.","exampleKo":"토요일은 안 돼요."},"fahre":{"meaning":"(타고) 가다 (fahren)","example":"Da fahre ich zu meinen Eltern nach Köln.","exampleKo":"그날은 쾰른에 계신 부모님 댁에 가요."},"Eltern":{"meaning":"부모님 (die Eltern)","example":"Da fahre ich zu meinen Eltern nach Köln.","exampleKo":"그날은 쾰른에 계신 부모님 댁에 가요."},"Köln":{"meaning":"쾰른 (독일 서부의 도시)","example":"Da fahre ich zu meinen Eltern nach Köln.","exampleKo":"그날은 쾰른에 계신 부모님 댁에 가요."},"nächste":{"meaning":"다음의 — nächste Woche = 다음 주","example":"Und nächste Woche?","exampleKo":"그럼 다음 주는요?"},"Woche":{"meaning":"주 (die Woche)","example":"Und nächste Woche?","exampleKo":"그럼 다음 주는요?"},"Dienstag":{"meaning":"화요일 (der Dienstag)","example":"Am Dienstag haben wir bis acht Uhr abends geöffnet.","exampleKo":"화요일에는 저녁 8시까지 문을 열어요."},"acht":{"meaning":"8, 여덟","exam n(14)에 들어 있는 vier(4)에 속지 마세요. 저녁 8시까지 여는 날은 화요일입니다.","trap":"number"},{"no":"3","de":"Was macht Herr Kim am Samstag?","ko":"김 씨는 토요일에 무엇을 하는가? a) 두 시까지 일한다 / b) 가족을 찾아간다 / c) 휴가를 떠난다","isExample":false,"options":[{"t":"Er arbeitet bis zwei Uhr."},{"t":"Er besucht seine Familie."},{"t":"Er fährt in den Urlaub."}],"answer":1,"confidence":"official","evidence":[{"line":6,"quote":"Da fahre ich zu meinen Eltern nach Köln."}],"explain":"토요일에는 쾰른에 계신 부모님(Eltern) 댁에 간다고 했습니다 → 가족(Familie)을 찾아갑니다. 휴가(Urlaub) 중인 사람은 미용사 톰입니다.","trap":"paraphrase"},{"no":"4","de":"Wie viel bezahlt Herr Kim für den Termin?","ko":"김 씨는 이번 예약에 얼마를 내는가? a) 28유로 / b) 20유로 / c) 22유로","isExample":false,"options":[{"t":"28 Euro"},{"t":"20 Euro"},{"t":"22 Euro"}],"answer":2,"confidence":"official","evidence":[{"line":10,"quote":"Nur Schneiden, bitte."},{"line":9,"quote":"Nur Schneiden kostet zweiundzwanzig Euro."}],"explain":"김 씨는 커트만(nur Schneiden) 하겠다고 했고, 커트만 하면 22유로라고 했습니다. 28유로는 샴푸·커트·드라이를 모두 할 때의 값입니다.","trap":"number"},{"no":"5","de":"Was sagt die Friseurin über Tom?","ko":"미용사는 톰에 대해 무엇이라고 말하는가? a) 톰은 저녁에는 일하지 않는다 / b) 톰은 이제 다른 미용실에서 일한다 / c) 톰은 몇 주 동안 없다","isExample":false,"options":[{"t":"Tom arbeitet abends nicht."},{"t":"Tom arbeitet jetzt in einem anderen Salon."},{"t":"Tom ist ein paar Wochen nicht da."}],"answer":2,"confidence":"official","evidence":[{"line":13,"quote":"Tom ist leider im Urlaub. Er kommt erst in drei Wochen zurück."}],"explain":"톰은 휴가 중이고 3주 뒤에야 돌아온다고 했습니다 → 몇 주 동안(ein paar Wochen) 미용실에 없습니다.","trap":"paraphrase"},{"no":"6","de":"Wer schneidet Herrn Kim am Dienstag die Haare?","ko":"화요일에 누가 김 씨의 머리를 자르는가? a) 사라 / b) 톰 / c) 전화를 받은 여자","isExample":false,"options":[{"t":"Sarah"},{"t":"Tom"},{"t":"die Frau am Telefon"}],"answer":0,"confidence":"official","evidence":[{"line":14,"quote":"Okay, dann gehe ich zu Sarah."}],"explain":"톰은 휴가 중이라 사라에게 하기로 했습니다. 전화를 받은 사람은 레나입니다.","trap":"wording"},{"no":"7","de":"Wie ist die Telefonnummer von Herrn Kim?","ko":"김 씨의 전화번호는 무엇인가? a) 0167 234 5589 / b) 0176 234 5589 / c) 0176 243 5589","isExample":false,"options":[{"t":"0167 234 5589"},{"t":"0176 234 5589"},{"t":"0176 243 5589"}],"answer":1,"confidence":"official","evidence":[{"line":18,"quote":"Null eins sieben sechs, zwei drei vier, fünf fünf acht neun."}],"explain":"null eins sieben sechs(0176), zwei drei vier(234), fünf fünf acht neun(5589)라고 했습니다. 숫자 순서가 바뀐 번호에 주의하세요.","trap":"number"},{"no":"8","de":"Wann soll Herr Kim am Dienstag in den Salon kommen?","ko":"김 씨는 화요일 몇 시에 미용실에 와야 하는가? a) 7시 10분 / b) 6시 50분 / c) 7시 정각","isExample":false,"options":[{"t":"um zehn nach sieben"},{"t":"um zehn vor sieben"},{"t":"um sieben Uhr"}],"answer":1,"confidence":"official","evidence":[{"line":19,"quote":"um neunzehn Uhr bei Sarah"},{"line":19,"quote":"Bitte kommen Sie zehn Minuten früher."}],"explain":"예약은 19시(= 저녁 7시)이고 10분 일찍(zehn Minuten früher) 오라고 했습니다 → 6시 50분, 독일어로 zehn vor sieben(7시 10분 전)입니다.","trap":"number"},{"no":"9","de":"Wie kommt Herr Kim am Dienstag zum Salon?","ko":"김 씨는 화요일에 미용실에 어떻게 가는가? a) 차를 타고 가지 않는다 / b) 슈퍼마켓 뒤 주차 건물에 차를 세운다 / c) 미용실 바로 앞에 차를 세운다","isExample":false,"options":[{"t":"Er kommt nicht mit dem Auto."},{"t":"Er parkt im Parkhaus hinter dem Supermarkt."},{"t":"Er parkt direkt vor dem Salon."}],"answer":0,"confidence":"official","evidence":[{"line":22,"quote":"Das Parkhaus ist teuer. Ich komme mit dem Bus."}],"explain":"주차 건물은 비싸서 버스를 타고 가겠다고 했습니다 → 차를 타고 가지 않습니다(nicht mit dem Auto). 미용실 바로 앞에 있는 것은 버스 정류장입니다.","trap":"negation"}]},{"id":"a1-13-a-durchsagen","sec":"A1_13","audio":"A1_13_A","dur":125.71,"topic":"Durchsagen","topicKo":"여러 장소의 안내 방송","situation":"Sie hören fünf Durchsagen. Wo hört man das? · Beispiel + Aufgabe 1–9 · 2회 청취 (문제 읽기 60초)","plays":2,"prepSeconds":60,"transcriptSource":"official","hasT":true,"lines":[{"sp":"Supermarkt","text":"Liebe Kundinnen und Kunden, herzlich willkommen im Frischmarkt!","ko":"고객 여러분, 프리슈마르크트에 오신 것을 환영합니다!","t":[1.88,7.15]},{"sp":"Supermarkt","text":"Heute im Angebot: Äpfel und Bananen. Ein Kilo kostet nur einen Euro neunzig.","ko":"오늘의 특가 상품은 사과와 바나나입니다. 1킬로그램에 1유로 90센트밖에 하지 않습니다.","t":[7.34,15.29]},{"sp":"Supermarkt","text":"Unsere Bäckerei ist heute leider geschlossen. Frisches Brot gibt es erst morgen wieder.","ko":"저희 빵 코너는 오늘 아쉽게도 문을 닫았습니다. 갓 구운 빵은 내일에야 다시 나옵니다.","t":[15.48,22.16]},{"sp":"Supermarkt","text":"Und noch etwas: Kasse drei ist jetzt auch geöffnet. Vielen Dank!","ko":"그리고 하나 더 알려 드립니다. 이제 3번 계산대도 엽니다. 감사합니다!","t":[22.35,27.82]},{"sp":"Schwimmbad","text":"Achtung, liebe Badegäste! Unser Hallenbad schließt heute schon um achtzehn Uhr.","ko":"안내 말씀드립니다, 수영장 이용객 여러분! 저희 실내 수영장은 오늘 평소보다 이른 18시에 문을 닫습니다.","t":[30.11,36.53]},{"sp":"Schwimmbad","text":"Bitte kommen Sie um Viertel vor sechs aus dem Wasser.","ko":"5시 45분에는 물에서 나와 주세요.","t":[36.72,40.17]},{"sp":"Schwimmbad","text":"Morgen ist das Bad wieder normal geöffnet, von acht bis zweiundzwanzig Uhr.","ko":"내일은 다시 평소처럼 8시부터 22시까지 문을 엽니다.","t":[40.36,46.22]},{"sp":"Schwimmbad","text":"Und: An der Kasse liegt ein rotes Handy. Ist das Ihr Handy? Dann kommen Sie bitte zur Kasse.","ko":"그리고 매표소에 빨간 휴대폰이 있습니다. 여러분의 휴대폰인가요? 그러면 매표소로 와 주세요.","t":[46.41,54.13]},{"sp":"Flughafen","text":"Information für die Passagiere von Flug sieben eins zwei nach Seoul.","ko":"서울행 712편 승객 여러분께 안내 말씀드립니다.","t":[56.42,61.6]},{"sp":"Flughafen","text":"Ihr Flug hat leider vierzig Minuten Verspätung. Er startet erst um zwölf Uhr fünfzig.","ko":"여러분이 타실 항공편은 유감스럽게도 40분 늦어집니다. 12시 50분에야 출발합니다.","t":[61.79,68.45]},{"sp":"Flughafen","text":"Ihr Flug startet jetzt nicht mehr von Gate sieben. Bitte gehen Sie zu Gate fünfzehn.","ko":"이제 7번 탑승구에서 출발하지 않습니다. 15번 탑승구로 가 주세요.","t":[68.64,74.77]},{"sp":"Flughafen","text":"Passagiere mit kleinen Kindern dürfen zuerst einsteigen.","ko":"어린 자녀를 동반한 승객은 먼저 탑승하실 수 있습니다.","t":[74.96,79.26]},{"sp":"Zoo","text":"Liebe Besucherinnen und Besucher! Um fünfzehn Uhr füttern wir die Pinguine.","ko":"방문객 여러분! 15시에 펭귄에게 먹이를 줍니다.","t":[81.55,87.96]},{"sp":"Zoo","text":"Kommen Sie zum Pingu 수 있다","isExample":true,"options":[{"t":"Supermarkt"},{"t":"Schwimmbad"},{"t":"Flughafen"},{"t":"Zoo"},{"t":"Schiff"}],"answer":0,"confidence":"official","evidence":[{"line":3,"quote":"Kasse drei ist jetzt auch geöffnet."}],"explain":"슈퍼마켓 방송에서 3번 계산대도 이제 연다(Kasse drei ist jetzt auch geöffnet)고 했습니다. 수영장에도 Kasse(매표소)가 나오지만, 거기서는 휴대폰을 찾아가라는 이야기입니다.","trap":"paraphrase"},{"no":"1","de":"Hier muss man heute früher gehen.","ko":"여기서는 오늘 평소보다 일찍 나가야 한다","isExample":false,"options":[{"t":"Supermarkt"},{"t":"Schwimmbad"},{"t":"Flughafen"},{"t":"Zoo"},{"t":"Schiff"}],"answer":1,"confidence":"official","evidence":[{"line":4,"quote":"Unser Hallenbad schließt heute schon um achtzehn Uhr."},{"line":5,"quote":"Bitte kommen Sie um Viertel vor sechs aus dem Wasser."}],"explain":"실내 수영장이 오늘은 18시에 일찍(schon) 문을 닫으니 17시 45분(Viertel vor sechs)에 물에서 나오라고 했습니다 → 평소보다 일찍(früher) 나가야 합니다. 내일은 다시 22시까지 엽니다. 슈퍼마켓 빵 코너도 닫았지만 손님이 나가야 하는 것은 아닙니다.","trap":"paraphrase"},{"no":"2","de":"Hier gibt es um drei Uhr nachmittags etwas zu sehen.","ko":"여기서는 오후 3시에 구경할 거리가 있다","isExample":false,"options":[{"t":"Supermarkt"},{"t":"Schwimmbad"},{"t":"Flughafen"},{"t":"Zoo"},{"t":"Schiff"}],"answer":3,"confidence":"official","evidence":[{"line":12,"quote":"Um fünfzehn Uhr füttern wir die Pinguine."},{"line":13,"quote":"Kommen Sie zum Pinguinhaus und schauen Sie zu!"}],"explain":"동물원에서 15시(fünfzehn Uhr = 오후 3시)에 펭귄 먹이 주기를 하니 와서 구경하라(schauen Sie zu)고 했습니다. 공항 방송의 fünfzehn은 시각이 아니라 15번 탑승구(Gate fünfzehn)입니다. 배의 식당은 14시까지 영업합니다.","trap":"number"},{"no":"3","de":"Hier ist Obst heute billig.","ko":"여기서는 오늘 과일이 싸다","isExample":false,"options":[{"t":"Supermarkt"},{"t":"Schwimmbad"},{"t":"Flughafen"},{"t":"Zoo"},{"t":"Schiff"}],"answer":0,"confidence":"official","evidence":[{"line":1,"quote":"Heute im Angebot: Äpfel und Bananen."},{"line":1,"quote":"Ein Kilo kostet nur einen Euro neunzig."}],"explain":"사과와 바나나(= Obst, 과일)가 오늘 특가(im Angebot)이고 1킬로그램에 1유로 90센트밖에(nur) 안 한다고 했습니다 → 과일이 쌉니다. 동물원 방송에도 바나나가 나오지만, 동물에게 주지 말라는 이야기입니다.","trap":"wording"},{"no":"4","de":"Hier ist die Fahrt bald zu Ende.","ko":"여기서는 곧 운항이 끝난다","isExample":false,"options":[{"t":"Supermarkt"},{"t":"Schwimmbad"},{"t":"Flughafen"},{"t":"Zoo"},{"t":"Schiff"}],"answer":4,"confidence":"official","evidence":[{"line":16,"quote":"In zwanzig Minuten sind wir in Bonn."},{"line":16,"quote":"Dann steigen alle Fahrgäste aus."}],"explain":"선장이 20분 후에 본에 도착하고 그때 모든 승객이 내린다고 했습니다 → 배의 운항(Fahrt)이 곧(bald) 끝납니다. 공항에서는 여행이 끝나는 것이 아니라 늦게 시작합니다.","trap":"paraphrase"},{"no":"5","de":"Hier beginnt die Reise später.","ko":"여기서는 여행이 예정보다 늦게 시작된다","isExample":false,"options":[{"t":"Supermarkt"},{"t":"Schwimmbad"},{"t":"Flughafen"},{"t":"Zoo"},{"t":"Schiff"}],"answer":2,"confidence":"official","evidence":[{"line":9,"quote":"Ihr Flug hat leider vierzig Minuten Verspätung."},{"line":9,"quote":"Er startet erst um zwölf Uhr fünfzig."}],"explain":"비행기가 40분 늦어져(Verspätung) 12시 50분에야(erst) 출발한다고 했습니다 → 여행(Reise)이 예정보다 늦게 시작됩니다. 배는 곧 도착한다고 했습니다. 20분(zwanzig)과 40분(vierzig)도 잘 구별해야 합니다.","trap":"paraphrase"},{"no":"6","de":"Hier hat jemand sein Telefon vergessen.","ko":"여기서는 누군가 자기 전화기를 두고 갔다","isExample":false,"options":[{"t":"Supermarkt"},{"t":"Schwimmbad"},{"t":"Flughafen"},{"t":"Zoo"},{"t":"Schiff"}],"answer":1,"confidence":"official","evidence":[{"line":7,"quote":"An der Kasse liegt ein rotes Handy."},{"line":7,"quote":"Ist das Ihr Handy?"}],"explain":"수영장 매표소(Kasse)에 빨간 휴대폰(Handy = Telefon)이 있으니 주인은 찾아가라고 했습니다 → 누군가 휴대폰을 두고 갔습니다. 슈퍼마켓에도 Kasse가 나오지만 계산대를 연다는 이야기입니다.","trap":"wording"},{"no":"7","de":"Hier soll man den Tieren nichts zu essen geben.","ko":"여기서는 동물들에게 먹을 것을 주면 안 된다","isExample":false,"options":[{"t":"Supermarkt"},{"t":"Schwimmbad"},{"t":"Flughafen"},{"t":"Zoo"},{"t":"Schiff"}],"answer":3,"confidence":"official","evidence":[{"line":14,"quote":"bitte geben Sie den Tieren kein Brot und keine Bananen."}],"explain":"동물원에서 동물들에게 빵이나 바나나를 주지 말라(kein Brot und keine Bananen)고 했습니다 → 먹을 것을 주면 안 됩니다. 15시에 먹이를 주는 사람은 방문객이 아니라 동물원 직원입니다(füttern wir).","trap":"negation"},{"no":"8","de":"Hier können Mütter und Väter mit Babys zuerst einsteigen.","ko":"여기서는 아기를 데리고 온 엄마와 아빠가 먼저 탈 수 있다","isExample":false,"options":[{"t":"Supermarkt"},{"t":"Schwimmbad"},{"t":"Flughafen"},{"t":"Zoo"},{"t":"Schiff"}],"answer":2,"confidence":"official","evidence":[{"line":11,"quote":"Passagiere mit kleinen Kindern dürfen zuerst einsteigen."}],"explain":"공항 방송에서 어린 자녀를 동반한 승객(Passagiere mit kleinen Kindern)이 먼저 탑승할 수 있다고 했습니다 → 아기(Babys)를 데리고 온 엄마와 아빠(Mütter und Väter)도 먼저 탈 수 있습니다. 배 방송에 나오는 것은 타는 것(einsteigen)이 아니라 내리는 것(aussteigen)입니다.","trap":"wording"},{"no":"9","de":"Hier kann man heute kein Brot vom Bäcker kaufen.","ko":"여기서는 오늘 빵집에서 만든 빵을 살 수 없다","isExample":false,"options":[{"t":"Supermarkt"},{"t":"Schwimmbad"},{"t":"Flughafen"},{"t":"Zoo"},{"t":"Schiff"}],"answer":0,"confidence":"official","evidence":[{"line":2,"quote":"Unsere Bäckerei ist heute leider geschlossen."},{"line":2,"quote":"Frisches Brot gibt es erst morgen wieder."}],"explain":"슈퍼마켓 빵 코너(Bäckerei)가 오늘 문을 닫아서 갓 구운 빵은 내일에야 다시 있다고 했습니다 → 오늘은 빵집(Bäcker)에서 만든 빵을 살 수 없습니다. 동물원 방송에도 kein Brot가 나오지만, 동물에게 빵을 주지 말라는 뜻입니다.","trap":"wording"}]}],"baseVocab":{}}</script>

function playSeg(a,b,id){if(seg&&seg.id===id){au.pause();stopSeg();return;}seg=null;var go=function(){try{au.currentTime=Math.max(0,a);}catch(e){}seg={end:b,id:id};markSeg();var p=au.play();if(p&&p.catch)p.catch(function(){});raf(tick);};if(au.readyState>=1)go();else{var once=function(){au.removeEventListener('loadedmetadata',once);go();};au.addEventListener('loadedmetadata',once);au.load();}}
function tick(){if(!seg)return;if(au.currentTime>=seg.end||au.ended){au.pause();seg=null;markSeg();return;}raf(tick);}
function syncPlayer(){var p=app.querySelector('[data-player]');if(!p)return;var d=isFinite(au.duration)&&au.duration>0?au.duration:(item()?item().dur:0);p.querySelector('.ptime').textContent=fmt(au.currentTime)+' / '+fmt(d);var sk=p.querySelector('.seek');if(sk&&!sk._drag)sk.value=d?Math.round(au.currentTime/d*1000):0;var pp=p.querySelector('.pp');pp.textContent=au.paused?'▶':'❚❚';pp.setAttribute('aria-label',au.paused?'재생':'일시정지');var sp=p.querySelectorAll('[data-act="speed"]');for(var i=0;i<sp.length;i++)sp[i].classList.toggle('on',Math.abs(parseFloat(sp[i].getAttribute('data-arg'))-au.playbackRate)<0.001);}

au.addEventListener('ended',function(){if(S.screen==='loop'&&S.step===2&&S.L&&!S.L.first.locked&&!seg)S.L.first.ended++;});
au.addEventListener('ratechange',function(){if(S.screen==='loop'&&S.step===2&&S.L&&!S.L.first.locked)S.L.first.minRate=Math.min(S.L.first.minRate,au.playbackRate);});

function loadAudio(){var it=item();seg=null;au.pause();var src=it&&it.audio?media(it.audio):'';if(src&&!/^(data|blob):/.test(src)&&location.protocol!=='file:'){var key=it.audio;if(blobUrl[key]){au.src=blobUrl[key];au.load();}else{au.removeAttribute('src');au.load();if(!blobPend[key]){blobPend[key]=1;fetch(src).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.blob();}).then(function(b){delete blobPend[key];var u=URL.createObjectURL(b);blobUrl[key]=u;blobOrder.push(key);while(blobOrder.length>4){var old=blobOrder.shift();if(old!==key&&blobUrl[old]){URL.revokeObjectURL(blobUrl[old]);delete blobUrl[old];}}if(audioIsFor(key)){au.src=u;au.load();au.playbackRate=1;}}).catch(function(){delete blobPend[key];if(audioIsFor(key))toast('음원을 받지 못했습니다. 인터넷 연결을 확인한 뒤 지문을 다시 여세요.');});}}}else if(src){au.src=src;au.load();}else{au.removeAttribute('src');}au.playbackRate=1;}

h+='<div class="q" data-q="'+qi+'"><div class="qh"><span class="qn'+(ex?' ex':'')+'">'+esc(ex?'Beispiel':q.no)+'</span><span class="qd">'+esc(q.de)+(q.confidence==='uncertain'&&mode==='final'?'<span class="unc">정답 미확정</span>':'')+'</span></div>';
