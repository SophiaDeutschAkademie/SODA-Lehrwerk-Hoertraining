function vStep3(){var it=item(),L=S.L,h=sth('지문을 읽으며 확인합니다','모르는 단어는 눌러서 뜻을 보고, 해석이 안 되는 줄은 ?를 누르세요.'+(it.hasT?' ▶는 그 줄만 다시 들려줍니다.':''));
if(it.transcriptSource==='asr-unreviewed')h+='<div class="warnbox">이 지문은 음성 인식으로 받아쓴 것이라 교재 원문과 다른 곳이 있을 수 있습니다.</div>';
h+=vPlayer()+'<div class="card" data-transcript>'+it.lines.map(function(_,li){return vLine(it,li,'read');}).join('')+'</div>';
h+=vWordCards(it,L)+vSentCards(it,L,'s');
h+=chk('u',L.understood,'모든 단어와 문장을 이해했다','und');
h+=nextBtn(L.understood);
if(L.pop){var p=L.pop;h+='<div class="pop" role="dialog" aria-label="단어 뜻"><div class="in"><div class="w">'+esc(p.w)+'</div>'+(p.e?'<div class="mm">'+esc(p.e.meaning)+'</div>'+(p.e.example?'<div class="ex">'+esc(p.e.example)+'</div><div class="exk">'+esc(p.e.exampleKo||'')+'</div>':''):'<div class="mm small">뜻이 등록되지 않은 단어입니다. 기록에 남겨 선생님께 전달합니다.</div>')+'<div class="row"><button data-act="unword" data-arg="'+esc(p.w)+'">체크 해제</button><button data-act="popclose">닫기</button></div></div></div>';}
return h;}

function makeBlanks(){var it=item(),L=S.L,b={},n=0,want=Object.keys(L.words);var useVocab=want.length<4;
it.lines.forEach(function(ln,li){ln.text.split(' ').forEach(function(tok,ti){var c=core(tok);if(!c)return;if(L.words[c]){b[li+':'+ti]=1;n++;}});});
if(useVocab){it.lines.forEach(function(ln,li){var used=false;ln.text.split(' ').forEach(function(tok,ti){if(used||n>=14)return;var c=core(tok);if(c&&!b[li+':'+ti]&&(it.vx[c]||it.vl[c.toLowerCase()])){b[li+':'+ti]=1;n++;used=true;}});});}
L.blanks=b;}
function vStep4(){var it=item(),L=S.L,h=sth('지문 없이 다시 듣습니다','STEP 3에서 확인한 단어와 문장이 이제 들리는지 확인하세요.');
h+=vPlayer();
h+='<button class="ghost" data-act="cloze" aria-pressed="'+(L.cloze?'true':'false')+'">'+(L.cloze?'빈칸 지문 닫기':'빈칸 지문 보기')+'</button>';
if(L.cloze){if(!L.blanks)makeBlanks();h+='<div class="card" style="margin-top:12px"><div class="ct">들으면서 빈칸의 단어를 떠올리고, 눌러서 확인하세요</div>'+it.lines.map(function(_,li){return vLine(it,li,'cloze');}).join('')+'</div>';}
h+='<div class="card" style="margin-top:12px"><div class="ct">얼마나 들렸나요?</div><div class="rts">'+RATE4.map(function(r){return'<button class="rt'+(L.rate4===r[0]?' on':'')+'" data-act="rate4" data-arg="'+r[0]+'"><b>'+r[0]+'</b><span>'+r[1]+'</span></button>';}).join('')+'</div></div>';
return h+nextBtn(!!L.rate4);}

function scoreCard(){var L=S.L,f=tally(L.first.ans),g=tally(L.fin);if(!g.t)return'';var showF=M.firstPass!=='off'&&(L.first.locked||Object.keys(L.first.ans).length>0);
return'<div class="card"><div class="score">'+(showF?'<div><b data-score="first">'+f.c+' / '+f.t+'</b><span>1차 풀이 (지문 보기 전)</span></div>':'')+'<div'+(showF?'':' style="grid-column:1/-1"')+'><b data-score="final">'+g.c+' / '+g.t+'</b><span>최종 풀이</span></div></div></div>';}
function vStep5(){var it=item(),h=sth('문항을 다시 풀고 근거를 확인합니다','답을 고르면 바로 채점됩니다.'+(it.hasT?' ▶로 근거 구간을 다시 들을 수 있습니다.':''));
if(!it.questions.length)return h+'<div class="card small">이 지문에는 문항이 없습니다.</div>'+nextBtn(true);
h+='<div class="card">'+vQuestions('final')+'</div>';if(finalDone())h+=scoreCard();
return h+nextBtn(finalDone());}

function vStep6(){var L=S.L,h=sth('무엇이 어려웠는지 고릅니다','해당하는 것을 모두 고르세요. 다음 학습과 선생님 피드백에 쓰입니다.');
h+='<div class="card"><div class="chips">'+CAUSES.map(function(c){return'<button class="chip'+(L.causes[c[0]]?' on':'')+'" data-act="cause" data-arg="'+c[0]+'" aria-pressed="'+(L.causes[c[0]]?'true':'false')+'">'+c[1]+'</button>';}).join('')+'</div></div>';
h+='<div class="card"><div class="ct">메모 (선택)</div><textarea data-memo placeholder="안 들린 부분, 질문할 것">'+esc(L.memo)+'</textarea></div>';
return h+'<button class="primary" data-act="save"'+(Object.keys(L.causes).length?'':' disabled')+'>✓ 학습 완료</button>';}

function vStep7(){var it=item(),L=S.L,h=sth('학습 완료!','체크한 단어와 문장을 소리와 함께 한 번 더 확인하세요.');
h+=scoreCard()+vWordCards(it,L)+vSentCards(it,L,'r');
if(!Object.keys(L.words).length&&!Object.keys(L.sents).length)h+='<div class="card small">체크한 단어와 문장이 없습니다.</div>';
return h+'<button class="primary" data-act="again">다른 지문 학습하기</button><button class="ghost" data-act="hist">학습 기록 보기</button>';}

function pct(c,t){return t?Math.round(c/t*100):0;}
function vHist(){var H=hist(),h='<div class="bar"><button class="bk" data-act="home" aria-label="처음으로">←</button><span class="stepno">학습 기록</span><span></span></div>';
var fc=0,ft=0,gc=0,gt=0,causes={},traps={},words={},bySec={};
H.forEach(function(r){if(!r)return;if(r.first&&r.first.total){fc+=r.first.correct;ft+=r.first.total;var b=bySec[r.sectionLabel||r.section||'?']||(bySec[r.sectionLabel||r.section||'?']={c:0,t:0});b.c+=r.first.correct;b.t+=r.first.total;}if(r.final&&r.final.total){gc+=r.final.correct;gt+=r.final.total;}(r.causes||[]).forEach(function(c){causes[c]=(causes[c]||0)+1;});(r.wrongTraps||[]).forEach(function(c){traps[c]=(traps[c]||0)+1;});(r.words||[]).forEach(function(w){words[w]=(words[w]||0)+1;});});
h+='<div class="card"><div class="ct">약점 분석 · 총 '+H.length+'회 학습</div>';
if(!H.length)h+='<div class="small">아직 기록이 없습니다. 지문 하나를 끝까지 학습하면 여기에 쌓입니다.</div>';
else{h+='<div class="score"><div><b>'+(ft?pct(fc,ft)+'%':'–')+'</b><span>1차 정답률 (지문 보기 전)</span></div><div><b>'+(gt?pct(gc,gt)+'%':'–')+'</b><span>최종 정답률</span></div></div>';
var bars=function(title,obj,label){var ks=Object.keys(obj);if(!ks.length)return'';var mx=Math.max.apply(null,ks.map(function(k){return obj[k];}));ks.sort(function(a,b){return obj[b]-obj[a];});return'<div class="ct" style="margin-top:16px">'+title+'</div><div class="bars">'+ks.slice(0,8).map(function(k){return'<div class="r"><span>'+esc(label(k))+'</span><i style="width:'+Math.max(4,Math.round(obj[k]/mx*40))+'%"></i><em>'+obj[k]+'</em></div>';}).join('')+'</div>';};
var secPct={};Object.keys(bySec).forEach(function(k){secPct[k]=pct(bySec[k].c,bySec[k].t);});
var ck={};CAUSES.forEach(function(c){ck[c[0]]=c[1];});
h+=bars('어려웠던 이유',causes,function(k){return ck[k]||k;})+bars('1차 풀이에서 걸린 함정',traps,function(k){return TRAPS[k]||k;})+bars('자주 체크한 단어',words,function(k){return k;});
var sk=Object.keys(secPct);if(sk.length>1)h+='<div class="ct" style="margin-top:16px">구간별 1차 정답률</div><div class="bars">'+sk.map(function(k){return'<div class="r"><span>'+esc(k)+'</span><i style="width:'+Math.max(4,Math.round(secPct[k]*0.4))+'%"></i><em>'+secPct[k]+'%</em></div>';}).join('')+'</div>';}
h+='</div>';
if(H.length){h+='<div class="card"><div class="ct">기록</div>'+H.map(function(r){if(!r)return'';var s=secById[r.section]||{};var d=r.ts?new Date(r.ts):null;return'<div class="hr"><div class="top"><span><span class="badge" style="--c:'+esc(s.color||'#8A8378')+'">'+esc(r.sectionLabel||r.level||'')+'</span> '+esc(r.topic||'')+'</span><span class="d">'+(d?(d.getMonth()+1)+'/'+d.getDate():'')+'</span></div><div class="small">'+(r.first&&r.first.total?'1차 '+r.first.correct+'/'+r.first.total+' → ':'')+(r.final&&r.final.total?'최종 '+r.final.correct+'/'+r.final.total:'')+(r.rate2?' · 첫 듣기 '+esc(r.rate2):'')+(r.rate4?' · 다시 듣기 '+esc(r.rate4):'')+'</div></div>';}).join('')+'</div>';}
h+='<div class="card"><div class="ct">선생님께 기록 보내기</div><input type="text" data-name placeholder="이름" value="'+esc(lsGet(NK)||'')+'" aria-label="이름"><button class="ghost" data-act="copy"'+(H.length?'':' disabled')+'>기록 복사</button><button class="ghost" data-act="file"'+(H.length?'':' disabled')+'>파일로 저장</button><textarea data-export readonly style="display:none;margin-top:8px" aria-label="기록 내용"></textarea>';
h+=S.confirmClear?'<button class="ghost" data-act="clearyes" style="color:var(--no)">정말 지웁니다. 되돌릴 수 없습니다</button>':'<button class="ghost" data-act="clear"'+(H.length?'':' disabled')+'>이 기기의 기록 지우기</button>';
return h+'</div>';}

function render(keep){var y=window.pageYOffset,ae=document.activeElement,fk=null;if(ae&&app.contains(ae)&&ae.getAttribute('data-act'))fk=[ae.getAttribute('data-act'),ae.getAttribute('data-arg')];
var h;if(S.screen==='cover')h=vCover();else if(S.screen==='home')h=vHome();else if(S.screen==='texts')h=vTexts();else if(S.screen==='hist')h=vHist();else h=bar()+[vStep1,vStep2,vStep3,vStep4,vStep5,vStep6,vStep7][S.step-1]();
app.setAttribute('data-screen',S.screen);app.setAttribute('data-step',S.screen==='loop'?S.step:'');
if(S.screen==='loop'||S.screen==='texts')app.style.setProperty('--c',sec().color);else app.style.removeProperty('--c');
app.innerHTML=h;
var im=app.querySelectorAll('img[data-img]');for(var i=0;i<im.length;i++)im[i].src=media(im[i].getAttribute('data-img'));
var sk=app.querySelector('.seek');if(sk){sk.addEventListener('input',function(){sk._drag=true;});sk.addEventListener('change',function(){sk._drag=false;var d=isFinite(au.duration)&&au.duration>0?au.duration:item().dur;stopSeg();try{au.currentTime=d*sk.value/1000;}catch(e){}});}
syncPlayer();markSeg();
if(keep){window.scrollTo(0,y);if(fk){var el=app.querySelector('[data-act="'+fk[0]+'"]'+(fk[1]!=null?'[data-arg="'+fk[1]+'"]':''));if(el&&el.focus)try{el.focus({preventScroll:true});}catch(e){}}}else window.scrollTo(0,0);}

function go(screen){S.screen=screen;S.confirmClear=false;if(screen!=='loop'){seg=null;au.pause();}render(false);}
function enterItem(ix){S.idx=ix;S.step=1;S.L=newLoop();S.screen='loop';loadAudio();render(false);}
function save(){var it=item(),L=S.L,s=sec(),f=tally(L.first.ans),g=tally(L.fin),wt=[];it.questions.forEach(function(q,qi){if(scorable(q)&&q.trap&&L.first.ans[qi]!=null&&L.first.ans[qi]!==q.answer)wt.push(q.trap);});
var toArr=function(o){return it.questions.map(function(_,qi){return o[qi]==null?null:o[qi];});};
var rec={v:2,id:String(L.t0),ts:Date.now(),itemId:it.id,section:s.id,sectionLabel:s.label,level:s.id,textIndex:s.items.indexOf(S.idx),topic:it.topic,
first:{correct:f.c,total:f.t,answers:toArr(L.first.ans),locked:L.first.locked,rate:L.first.rate,minRate:L.first.minRate,plays:L.first.ended},
final:{correct:g.c,total:g.t,answers:toArr(L.fin)},rate2:L.rate2,rate4:L.rate4,causes:Object.keys(L.causes),memo:L.memo,
words:Object.keys(L.words),sentences:Object.keys(L.sents).map(Number),missing:Object.keys(L.missing),wrongTraps:wt,clozeOpened:Object.keys(L.open).length,seconds:Math.round((Date.now()-L.t0)/1000)};
var H=hist();H.unshift(rec);var ok=lsSet(HK,JSON.stringify(H));L.saved=true;if(!ok)toast('이 브라우저에서는 기록이 저장되지 않습니다. 창을 닫기 전에 기록을 복사하세요.');}
function exportText(){return JSON.stringify({app:'listening-routine',format:2,set:HK,title:M.title,student:lsGet(NK)||'',exportedAt:new Date().toISOString(),records:hist()});}
function showExport(txt){var ta=app.querySelector('[data-export]');if(!ta)return;ta.style.display='block';ta.value=txt;ta.focus();ta.select();}

var ACT={
home:function(){go('home');},
start:function(){go('home');},
hist:function(){go('hist');},
lv:function(a){S.lv=a;lsSet(HK+'-lv',a);render(true);},
sec:function(a){S.sec=a;var s=sec();if(s.items.length>1)go('texts');else enterItem(s.items[0]);},
item:function(a){enterItem(parseInt(a,10));},
back:function(){var s=sec();if(S.screen==='loop'&&s.items.length>1)go('texts');else go('home');},
again:function(){var s=sec();if(s.items.length>1)go('texts');else go('home');},
next:function(){if(S.step<7){S.step++;seg=null;au.pause();S.L.pop=null;render(false);}},
c1:function(a){S.L.c1[a]=!S.L.c1[a];render(true);},
fp:function(a){var p=a.split(':');if(S.L.first.locked)return;S.L.first.ans[p[0]]=parseInt(p[1],10);render(true);},
fplock:function(){if(!firstDone())return;S.L.first.locked=true;S.L.first.rate=au.playbackRate;render(true);},
rate2:function(a){S.L.rate2=a;render(true);},
rate4:function(a){S.L.rate4=a;render(true);},
tok:function(a){var p=a.split(':'),it=item(),tok=it.lines[p[0]].text.split(' ')[p[1]],c=core(tok),hit=lookup(it,tok);S.L.words[c]=1;if(!hit)S.L.missing[c]=1;S.L.pop={w:c,e:hit?hit.e:null};render(true);},
unword:function(a){delete S.L.words[a];delete S.L.missing[a];S.L.pop=null;render(true);},
popclose:function(){S.L.pop=null;render(true);},
sq:function(a){if(S.L.sents[a])delete S.L.sents[a];else S.L.sents[a]=1;render(true);},
und:function(){S.L.understood=!S.L.understood;render(true);},
seg:function(a,el){var ln=item().lines[a];if(ln&&ln.t)playSeg(ln.t[0],ln.t[1],el.getAttribute('data-seg'));},
cloze:function(){S.L.cloze=!S.L.cloze;render(true);},
blank:function(a){S.L.open[a]=1;render(true);},
ans:function(a){var p=a.split(':');if(S.L.fin[p[0]]!=null)return;S.L.fin[p[0]]=parseInt(p[1],10);render(true);},
cause:function(a){if(S.L.causes[a])delete S.L.causes[a];else{if(a==='none')S.L.causes={};else delete S.L.causes.none;S.L.causes[a]=1;}render(true);},
save:function(){if(!Object.keys(S.L.causes).length)return;var m=app.querySelector('[data-memo]');if(m)S.L.memo=m.value;save();S.step=7;render(false);},
pp:function(){stopSeg();if(!au.getAttribute('src')){toast('음원을 불러오는 중입니다. 잠시 뒤 다시 누르세요.');return;}if(au.paused){var p=au.play();if(p&&p.catch)p.catch(function(){});}else au.pause();},
back3:function(){stopSeg();try{au.currentTime=Math.max(0,au.currentTime-3);}catch(e){}},
speed:function(a){au.playbackRate=parseFloat(a);syncPlayer();},
copy:function(){var txt=exportText(),done=function(){toast('기록을 복사했습니다. 메신저에 붙여 넣어 보내세요.');};
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){showExport(txt);toast('아래 내용을 길게 눌러 복사하세요.');});}
else{showExport(txt);var ok=false;try{ok=document.execCommand('copy');}catch(e){}if(ok)done();else toast('아래 내용을 길게 눌러 복사하세요.');}},
file:function(){var txt=exportText();try{var b=new Blob([txt],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=(lsGet(NK)||'student')+'_'+HK.replace('listening-loop-history-','')+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u);},4000);}catch(e){showExport(txt);toast('파일 저장이 막혀 있습니다. 아래 내용을 복사하세요.');}},
clear:function(){S.confirmClear=true;render(true);},
clearyes:function(){lsSet(HK,'[]');S.confirmClear=false;render(true);toast('기록을 지웠습니다.');}
};
app.addEventListener('click',function(e){var el=e.target.closest?e.target.closest('[data-act]'):null;if(!el||!app.contains(el)||el.disabled)return;var f=ACT[el.getAttribute('data-act')];if(f)f(el.getAttribute('data-arg'),el);});
app.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('tk')){e.preventDefault();e.target.click();}if(e.key==='Escape'&&S.L&&S.L.pop){S.L.pop=null;render(true);}});
app.addEventListener('input',function(e){var t=e.target;if(t.hasAttribute&&t.hasAttribute('data-memo')&&S.L)S.L.memo=t.value;if(t.hasAttribute&&t.hasAttribute('data-name'))lsSet(NK,t.value);});
window.__routine={state:S,data:D,version:'1.1'};
render(false);
})();

window.addEventListener('appinstalled',function(){deferred=null;standalone=true;offerInstall();closeSheet();});
offerInstall();
var SHARE='<svg class="sx-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
function guide(){
  if(inapp){var url=location.href.split('#')[0];
    return{t:'브라우저에서 열어 주세요',c:'<p class="sx-sheet-p">카카오톡 같은 앱 안에서 연 화면에서는 홈 화면에 추가할 수 없어요.</p>'+
      (kakao?'<a class="sx-btn sx-sheet-go" href="kakaotalk://web/openExternal?url='+encodeURIComponent(url)+'">다른 브라우저로 열기</a>':'')+
      '<ol><li>화면 위나 아래의 <b>⋮</b> 또는 <b>⋯</b> 메뉴를 누르세요.</li><li><b>다른 브라우저로 열기</b>(아이폰은 <b>Safari로 열기</b>)를 누르세요.</li><li>'+
      (ios?'Safari':'Chrome')+'에서 다시 <b>홈 화면에 앱 추가</b>를 누르세요.</li></ol>'};}
  if(ios){return{t:'홈 화면에 추가',c:'<ol><li>Safari의 공유 버튼 '+SHARE+'을 누르세요. 버튼이 보이지 않으면 <b>⋯</b> 메뉴 안에 있어요.</li>'+
    '<li><b>홈 화면에 추가</b>를 누르세요.</li><li>홈 화면에 생긴 <b>'+esc(NAME)+'</b> 아이콘으로 여세요.</li></ol>'+
    '<p class="sx-sheet-n">학습 기록은 홈 화면 앱과 Safari에 따로 저장돼요. 아이콘으로 연 앱에서 공부하세요.</p>'};}
  return{t:'홈 화면에 추가',c:'<ol><li>브라우저 오른쪽 위나 아래의 메뉴 <b>⋮</b> 또는 <b>≡</b>를 누르세요.</li>'+
    '<li><b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 누르세요.</li><li>홈 화면에 생긴 <b>'+esc(NAME)+'</b> 아이콘으로 여세요.</li></ol>'};}
var lastFocus=null;
function openSheet(){var g=guide();$('sx-sheet-t').textContent=g.t;$('sx-sheet-c').innerHTML=g.c;
  var close=sheet.querySelector('.sx-sheet-box > [data-close]'),hasGo=!!sheet.querySelector('.sx-sheet-go');
  close.className='sx-btn'+(hasGo?' is-ghost':'');close.textContent=hasGo?'닫기':'확인';
  lastFocus=document.activeElement;sheet.hidden=false;sheet.querySelector('.sx-sheet-box').focus();}
function closeSheet(){if(sheet.hidden)return;sheet.hidden=true;if(lastFocus&&lastFocus.focus)lastFocus.focus();}
sheet.addEventListener('click',function(e){var el=e.target;while(el&&el!==sheet){if(el.hasAttribute&&el.hasAttribute('data-close')){closeSheet();return;}el=el.parentNode;}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();});
document.addEventListener('click',function(e){var el=e.target;while(el&&el!==document&&!(el.getAttribute&&el.getAttribute('data-web')==='install'))el=el.parentNode;if(!el||el===document)return;
  if(deferred&&!inapp){var d=deferred;deferred=null;d.prompt();(d.userChoice||Promise.resolve()).then(offerInstall,offerInstall);return;}
  openSheet();});
if(!('serviceWorker' in navigator)||location.protocol==='file:')return;
var sw=navigator.serviceWorker,hadController=!!sw.controller,reloading=false;
sw.addEventListener('controllerchange',function(){if(!hadController){hadController=true;return;}if(reloading)return;reloading=true;location.reload();});
function offerUpdate(reg){$('sx-update').hidden=false;$('sx-update-go').onclick=function(){if(reg.waiting)reg.waiting.postMessage('skip-waiting');else location.reload();};}
window.addEventListener('load',function(){
  sw.register('sw.js').then(function(reg){
    function watch(w){if(!w)return;w.addEventListener('statechange',function(){if(w.state==='installed'&&sw.controller)offerUpdate(reg);});}
    if(reg.waiting&&sw.controller)offerUpdate(reg);
    watch(reg.installing);
    reg.addEventListener('updatefound',function(){watch(reg.installing);});
    var checked=Date.now();
    document.addEventListener('visibilitychange',function(){if(document.visibilityState!=='visible'||Date.now()-checked<30*60*1000)return;checked=Date.now();reg.update().catch(function(){});});
  }).catch(function(){});
  sw.ready.then(function(reg){var c=navigator.connection;if(c&&(c.saveData||c.type==='cellular'))return;
    setTimeout(function(){if(reg.active)reg.active.postMessage('warm');},3000);});
});
})();
</script>
</body>
</html>
